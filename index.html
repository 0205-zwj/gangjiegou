<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>中铁装配 钢结构构件信息</title>
    <link rel="preconnect" href="https://cdn.bootcdn.net" crossorigin>
    <link rel="preconnect" href="https://gcore.jsdelivr.net" crossorigin>
    <script type="module" defer src="https://cdn.bootcdn.net/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
        html,body{height:100%;}
        body {
            background:linear-gradient(160deg,#eef3f9 0%,#e4edf7 50%,#edeaf5 100%);
            padding:14px;max-width:100%;margin:0 auto;
            font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
            overflow-x:hidden;
            animation:fadeIn .3s cubic-bezier(.4,0,.2,1);
        }
        @keyframes fadeIn {from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

        .glow {
            position:fixed;width:500px;height:500px;border-radius:50%;
            background:radial-gradient(circle,rgba(140,120,255,.25) 0%,rgba(90,150,255,.15) 40%,transparent 70%);
            pointer-events:none;transform:translate(-50%,-50%);z-index:1;
            opacity:0;transition:opacity .3s ease;will-change:transform;
        }

        .header {
            position:relative;z-index:2;
            background:rgba(220,235,250,.7);
            backdrop-filter:blur(36px) saturate(220%);
            -webkit-backdrop-filter:blur(36px) saturate(220%);
            color:#1e3a5f;padding:12px 16px;border-radius:22px;text-align:center;margin-bottom:10px;
            box-shadow:0 8px 32px rgba(50,100,180,.15), 0 0 24px rgba(140,180,255,.3);
            border:1px solid rgba(255,255,255,.9);
        }
        .header h2 {font-size:17px;font-weight:600;letter-spacing:.5px;}
        .header p {font-size:10px;opacity:.6;margin-top:4px;letter-spacing:2px;font-weight:400;}

        .full-wrap {position:relative;z-index:2;width:100%;}
        .model-container {
            position:relative;width:100%;height:520px;
            background:rgba(220,235,250,.7);
            backdrop-filter:blur(36px) saturate(220%);
            border-radius:26px;overflow:hidden;
            box-shadow:0 16px 48px rgba(50,100,180,.18), 0 0 32px rgba(140,180,255,.3);
            border:1px solid rgba(255,255,255,.9);
            will-change:height;
        }
        model-viewer {
            width:100%;height:100%;
            --poster-color:#e8f2fc;
            touch-action:none;
            interpolation-decay:0.05;
            min-image-width:512;
            camera-orbit:0deg 75deg auto;
            camera-target:0m 0m 0m;
            field-of-view:30deg;
            min-field-of-view:5deg;
            max-field-of-view:80deg;
            polar-min:0deg;
            polar-max:180deg;
        }
        model-viewer:fullscreen, model-viewer:-webkit-full-screen {
            background:linear-gradient(160deg,#eef3f9 0%,#e4edf7 100%) !important;
            --poster-color:#e8f2fc;
        }
        model-viewer::part(ar-button),model-viewer::part(default-ar-button){display:none!important;}

        .toolbar{
            position:absolute;right:12px;top:50%;transform:translateY(-50%);z-index:20;
            display:flex;flex-direction:column;gap:10px;align-items:center;
        }
        .btn{
            width:42px;height:42px;border-radius:50%;
            background:rgba(255,255,255,.65);
            backdrop-filter:blur(24px) saturate(220%);
            color:#2563a8;border:1px solid rgba(255,255,255,.9);
            font-size:18px;cursor:pointer;
            box-shadow:0 4px 14px rgba(50,100,180,.12);
            transition:all .18s cubic-bezier(.4,0,.2,1);will-change:transform;
            display:flex;align-items:center;justify-content:center;
        }
        .btn:active{transform:scale(.92);}
        .btn.active{background:#2563a8;color:#fff;box-shadow:0 6px 20px rgba(37,99,168,.4);}

        .full-wrap:fullscreen{
            background:linear-gradient(160deg,#eef3f9 0%,#e4edf7 100%);
            padding:16px;display:flex;flex-direction:column;gap:12px;
            transition:all .35s cubic-bezier(.4,0,.2,1);
        }
        .full-wrap:fullscreen .model-container{
            flex:1;height:auto;background:rgba(220,235,250,.75);border-radius:20px;
        }
        .full-wrap:fullscreen .info-card{
            padding:12px 16px;border-radius:18px;
            display:grid;grid-template-columns:repeat(4,1fr);gap:8px 16px;
        }
        .full-wrap:fullscreen .info-card h3{
            grid-column:1/-1;font-size:13px;margin:0 0 4px;padding-bottom:6px;
        }
        .full-wrap:fullscreen .info-card .row{
            display:block;padding:0;font-size:12px;line-height:1.4;border-bottom:none;
        }
        .full-wrap:fullscreen .info-card .k{width:auto;display:block;font-size:11px;opacity:.7;margin-bottom:2px;}
        .full-wrap:fullscreen .info-card .v{font-size:12px;}
        @media screen and (orientation:landscape){
            .full-wrap:fullscreen{flex-direction:row;gap:12px;padding:12px;}
            .full-wrap:fullscreen .model-container{flex:1;}
            .full-wrap:fullscreen .info-card{
                max-width:240px;margin:0;flex-shrink:0;overflow-y:auto;
                display:block;padding:14px 16px;
            }
            .full-wrap:fullscreen .info-card .row{display:flex;padding:6px 0;font-size:12px;}
            .full-wrap:fullscreen .info-card .k{width:70px;display:block;font-size:11px;}
        }
        .full-wrap:fullscreen.panel-hidden .info-card{display:none;}
        .full-wrap:fullscreen.model-only-fullscreen{
            padding:0;gap:0;
        }
        .full-wrap:fullscreen.model-only-fullscreen .model-container{
            flex:1;border-radius:0;background:linear-gradient(160deg,#eef3f9 0%,#e4edf7 100%);
        }
        .full-wrap:fullscreen.model-only-fullscreen .info-card,
        .full-wrap:fullscreen.model-only-fullscreen .toolbar,
        .full-wrap:fullscreen.model-only-fullscreen .tip-banner{display:none!important;}

        .tip-banner{
            position:absolute;left:50%;transform:translateX(-50%);
            top:20px;z-index:21;color:#2563a8;font-size:12px;
            background:rgba(255,255,255,.88);backdrop-filter:blur(24px);
            padding:8px 18px;border-radius:26px;white-space:nowrap;
            box-shadow:0 8px 24px rgba(50,100,180,.18);transition:opacity .3s;
        }
        .toast{
            position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
            z-index:99;color:#2563a8;font-size:14px;font-weight:500;
            background:rgba(255,255,255,.92);backdrop-filter:blur(28px);
            padding:14px 28px;border-radius:26px;
            box-shadow:0 16px 48px rgba(50,100,180,.28);
            opacity:0;pointer-events:none;transition:opacity .25s;
        }
        .toast.show{opacity:1;}

        .model-list{
            position:fixed;left:0;right:0;bottom:0;z-index:99;
            background:rgba(238,243,249,.95);backdrop-filter:blur(40px);
            border-radius:24px 24px 0 0;padding:20px 16px 30px;
            max-height:85vh;overflow-y:auto;
            transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);
            box-shadow:0 -10px 40px rgba(50,100,180,.2);
        }
        .model-list.show{transform:translateY(0);}
        .model-list h3{color:#1e3a5f;font-size:15px;margin-bottom:18px;text-align:center;font-weight:600;}
        #modelItems{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
        .model-item{
            padding:12px 14px;background:rgba(255,255,255,.75);border-radius:16px;
            cursor:pointer;transition:all .2s cubic-bezier(.4,0,.2,1);
            box-shadow:0 4px 16px rgba(50,100,180,.08);
            border:1px solid rgba(255,255,255,.9);
        }
        .model-item:active{transform:scale(.97);box-shadow:0 8px 24px rgba(50,100,180,.15);}
        .model-item .mid{color:#1e3a5f;font-size:13px;font-weight:600;}
        .model-item .mname{color:#6088b8;font-size:10px;margin-top:2px;line-height:1.3;}
        .model-mask{position:fixed;inset:0;background:rgba(0,0,0,.15);z-index:98;opacity:0;pointer-events:none;transition:opacity .3s;}
        .model-mask.show{opacity:1;pointer-events:auto;}

        .progress{position:absolute;top:0;left:0;width:100%;height:6px;background:rgba(160,200,240,.3);z-index:11;overflow:hidden;transition:opacity .3s;}
        .progress.done{opacity:0;}
        .bar{height:100%;width:0%;background:linear-gradient(90deg,#5b8def,#2563a8);transition:width .2s;}
        .loading{
            position:absolute;top:0;left:0;width:100%;height:100%;
            background:rgba(228,237,247,.7);backdrop-filter:blur(16px);
            display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;
        }
        .spinner{
            width:46px;height:46px;border:5px solid rgba(160,200,240,.4);
            border-top:5px solid #2563a8;border-radius:50%;
            animation:spin 1s linear infinite;
        }
        .loading-text{font-size:14px;color:#2563a8;margin-top:16px;font-weight:500;}
        .progress-percent{font-size:22px;font-weight:600;color:#2563a8;margin-top:6px;}
        @keyframes spin{to{transform:rotate(360deg)}}
        .error{display:none;position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(255,255,255,.92);flex-direction:column;align-items:center;justify-content:center;z-index:10;color:#557;}

        .info-card{
            background:rgba(220,235,250,.7);
            backdrop-filter:blur(36px) saturate(220%);
            -webkit-backdrop-filter:blur(36px) saturate(220%);
            padding:22px;border-radius:26px;margin-top:14px;
            box-shadow:0 10px 40px rgba(50,100,180,.15), 0 0 24px rgba(140,180,255,.3);
            border:1px solid rgba(255,255,255,.9);
        }
        .info-card h3{
            color:#1e3a5f;font-size:16px;margin-bottom:14px;
            padding-bottom:12px;border-bottom:1px solid rgba(50,100,180,.15);font-weight:600;
        }
        .row{display:flex;padding:12px 0;border-bottom:1px solid rgba(50,100,180,.06);font-size:14px;line-height:1.5;}
        .row:last-child{border-bottom:none;}
        .k{width:90px;color:#6088b8;flex-shrink:0;font-weight:400;}
        .v{flex:1;color:#1e3a5f;word-break:break-all;font-weight:500;}

        .footer{text-align:center;color:#7098c8;font-size:11px;margin-top:18px;line-height:1.7;}
        .hide{display:none!important;}
    </style>
</head>
<body>
<div class="glow" id="glow"></div>
<div class="toast" id="toast">✅ 操作成功</div>
<button class="btn hide" id="btnExitFull" style="position:fixed;top:20px;right:20px;z-index:999;width:48px;height:48px;font-size:22px;background:rgba(255,255,255,.9);" title="退出全屏">↩️</button>
<button class="btn hide" id="btnRotateScreen" style="position:fixed;bottom:24px;right:20px;z-index:999;width:48px;height:48px;font-size:20px;background:rgba(255,255,255,.9);" title="切换横竖屏">📱</button>

<div class="header">
    <h2>中铁装配｜钢结构构件信息</h2>
    <p>CHINA RAILWAY ASSEMBLY</p>
</div>

<div class="full-wrap" id="fullWrap">
    <div class="tip-banner hide" id="tipBanner">💡竖屏横屏都可查看，拖动旋转360度看模型</div>
    <div class="model-container">
        <div class="progress"><div class="bar" id="bar"></div></div>
        <model-viewer id="viewer" alt="构件3D模型" shadow-intensity="0.5" camera-controls interaction-prompt="auto" polar-min="-180deg" polar-max="180deg" min-field-of-view="5deg" max-field-of-view="80deg"></model-viewer>
        <div class="toolbar">
            <button class="btn" id="btnRotate" title="自动旋转">🔄</button>
            <button class="btn" id="btnReset" title="重置视角">🎯</button>
            <button class="btn" id="btnFull" title="整页全屏">⛶</button>
            <button class="btn" id="btnModelFull" title="模型占满全屏">🖥️</button>
            <button class="btn" id="btnSwitch" title="切换构件">🔀</button>
            <button class="btn hide" id="btnToggle" title="隐藏/显示信息">ℹ️</button>
        </div>
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div class="loading-text">正在加载3D模型</div>
            <div class="progress-percent" id="percent">0%</div>
        </div>
        <div class="error" id="error">
            <p>3D模型加载失败，请检查网络刷新</p>
        </div>
    </div>

    <div class="info-card" id="infoCard">
        <h3>构件基本信息</h3>
        <div class="row"><div class="k">构件编号</div><div class="v" id="partId">-</div></div>
        <div class="row"><div class="k">加工号</div><div class="v" id="workNo">-</div></div>
        <div class="row"><div class="k">项目名称</div><div class="v" id="projectName">-</div></div>
        <div class="row"><div class="k">分部工程</div><div class="v" id="section">-</div></div>
        <div class="row"><div class="k">构件类型</div><div class="v" id="partType">-</div></div>
        <div class="row"><div class="k">材质</div><div class="v" id="material">-</div></div>
        <div class="row"><div class="k">规格</div><div class="v" id="spec">-</div></div>
        <div class="row"><div class="k">数量</div><div class="v" id="quantity">-</div></div>
    </div>
</div>

<div class="model-mask" id="modelMask"></div>
<div class="model-list" id="modelList">
    <h3>选择要查看的构件</h3>
    <div id="modelItems"></div>
</div>

<p class="footer">中铁装配 · 钢结构构件一物一码系统<br>制作人：赵文杰</p>

<script src="data.js"></script>
<script>
const $ = s => document.querySelector(s);
const id = new URLSearchParams(location.search).get('id');
const viewer = $('#viewer'), loading = $('#loading'), bar = $('#bar'), percent = $('#percent'),
error = $('#error'), fullWrap = $('#fullWrap'), btnFull = $('#btnFull'), btnModelFull = $('#btnModelFull'),
btnRotate = $('#btnRotate'), btnReset = $('#btnReset'), infoCard = $('#infoCard'), tipBanner = $('#tipBanner'),
glow = $('#glow'), btnSwitch = $('#btnSwitch'), btnToggle = $('#btnToggle'), btnExitFull = $('#btnExitFull'), toast = $('#toast');

let rotate = false, tipTimer = null, retryCount = 0;
const fields = ['partId','workNo','projectName','section','partType','material','spec','quantity'];

if(id && partData[id]){
    const d = partData[id];
    fields.forEach(f => {const el = $(`#${f}`); if(el && d[f]) el.innerText = d[f];});

    function loadModel(){
        viewer.src = d.glbUrl;
        viewer.autoRotateSpeed = 5;
    }
    loadModel();

    viewer.addEventListener('progress', e => {
        if(e.total){
            const p = Math.round(e.loaded/e.total*100);
            bar.style.width = p + '%';
            percent.innerText = p + '%';
        }
    });
    viewer.addEventListener('load', () => {
        bar.style.width = '100%';
        percent.innerText = '100%';
        setTimeout(()=>{
            loading.style.display = 'none';
            document.querySelector('.progress').classList.add('done');
        }, 200);
    });
    viewer.addEventListener('error', () => {
        if(retryCount < 1){retryCount++; setTimeout(loadModel, 1000);}
        else {loading.style.display='none'; error.style.display='flex';}
    });
}else{
    document.querySelector('.header h2').innerText = '构件信息未找到';
    document.querySelector('.model-container').style.display = 'none';
    loading.style.display = 'none';
}

btnModelFull.onclick = async () => {
    try{
        await fullWrap.requestFullscreen();
        fullWrap.classList.add('model-only-fullscreen');
        btnExitFull.classList.remove('hide');
        btnRotateScreen.classList.remove('hide');
        toast.innerText = "模型已占满全屏，可点右下角按钮切换横竖屏";
        toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'),2000);
    }catch(e){}
}
btnExitFull.onclick = () => {
    document.exitFullscreen();
    btnExitFull.classList.add('hide');
    btnRotateScreen.classList.add('hide');
}
let isLandscape = false;
const btnRotateScreen = $('#btnRotateScreen');
btnRotateScreen.onclick = () => {
    isLandscape = !isLandscape;
    if(isLandscape){
        viewer.style.transform = "rotate(90deg)";
        viewer.style.width = "100vh";
        viewer.style.height = "100vw";
        viewer.style.position = "absolute";
        viewer.style.top = "50%";
        viewer.style.left = "50%";
        viewer.style.transformOrigin = "center center";
        viewer.style.marginTop = "-50vw";
        viewer.style.marginLeft = "-50vh";
        toast.innerText = "已切换为横屏";
    }else{
        viewer.style.transform = "";
        viewer.style.width = "";
        viewer.style.height = "";
        viewer.style.position = "";
        viewer.style.top = "";
        viewer.style.left = "";
        viewer.style.transformOrigin = "";
        viewer.style.marginTop = "";
        viewer.style.marginLeft = "";
        toast.innerText = "已切换为竖屏";
    }
    toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'),1500);
}

const modelList = $('#modelList'), modelMask = $('#modelMask'), modelItems = $('#modelItems');
btnSwitch.onclick = () => {
    modelItems.innerHTML = '';
    Object.keys(partData).forEach(pid => {
        const d = partData[pid];
        const item = document.createElement('div');
        item.className = 'model-item';
        item.innerHTML = `<div class="mid">构件编号：${d.partId || pid}</div><div class="mname">${d.projectName || ''} · ${d.partType || ''}</div>`;
        item.onclick = () => {
            location.href = location.pathname + "?id=" + pid;
        };
        modelItems.appendChild(item);
    });
    modelList.classList.add('show');
    modelMask.classList.add('show');
};
modelMask.onclick = () => {
    modelList.classList.remove('show');
    modelMask.classList.remove('show');
};

function moveGlow(x,y){glow.style.left=x+'px';glow.style.top=y+'px';glow.style.opacity='1';}
document.addEventListener('mousemove',e=>moveGlow(e.clientX,e.clientY));
document.addEventListener('touchmove',e=>{if(e.touches[0])moveGlow(e.touches[0].clientX,e.touches[0].clientY);});
document.addEventListener('mouseleave',()=>glow.style.opacity='0');

btnRotate.onclick = () => {
    rotate = !rotate; viewer.autoRotate = rotate;
    btnRotate.classList.toggle('active',rotate);
}
btnReset.onclick = () => {viewer.cameraOrbit = "0deg 75deg auto"; viewer.cameraTarget = "0m 0m 0m";}

let clickCount = 0, clickTimer = null;
viewer.addEventListener('click', (e) => {
    clickCount++;
    clearTimeout(clickTimer);
    clickTimer = setTimeout(() => {
        if(clickCount === 3){
            const p = e.intersectionPoint;
            if(p){
                viewer.cameraTarget = `${p.x}m ${p.y}m ${p.z}m`;
                toast.innerText = "已定位到该点，可围绕该点旋转放大";
                toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'),1500);
            }
        }
        clickCount = 0;
    }, 350);
});

btnFull.onclick = async () => {
    try{
        if(!document.fullscreenElement){
            await fullWrap.requestFullscreen();
            btnToggle.classList.remove('hide'); tipBanner.classList.remove('hide');
            tipTimer = setTimeout(()=>tipBanner.classList.add('hide'),5000);
        }else document.exitFullscreen();
    }catch(e){}
}
document.addEventListener('fullscreenchange',()=>{
    if(!document.fullscreenElement){
        btnToggle.classList.add('hide'); tipBanner.classList.add('hide');
        btnExitFull.classList.add('hide'); btnRotateScreen.classList.add('hide');
        fullWrap.classList.remove('panel-hidden','model-only-fullscreen');
        infoCard.classList.remove('hide');
        clearTimeout(tipTimer);
    }
});
btnToggle.onclick = () => {
    const h = infoCard.classList.toggle('hide');
    fullWrap.classList.toggle('panel-hidden',h);
}
tipBanner.onclick = () => {tipBanner.classList.add('hide');clearTimeout(tipTimer);}

document.addEventListener('visibilitychange', () => {});
</script>
</body>
</html>
