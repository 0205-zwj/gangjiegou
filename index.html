<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>中铁装配 钢结构构件信息</title>
    <link rel="preconnect" href="https://cdn.bootcdn.net" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <!-- 预加载模型文件，提前开始下载，加快加载速度 -->
    <link rel="preload" as="fetch" id="modelPreload" crossorigin="anonymous">
    <script type="module" defer src="https://cdn.bootcdn.net/ajax/libs/model-viewer/3.5.0/model-viewer.min.js" onerror="const s=document.createElement('script');s.type='module';s.src='https://cdn.jsdelivr.net/npm/@google/model-viewer/dist/model-viewer.min.js';document.head.appendChild(s);"></script>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
        html,body{height:100%;}
        body {
            background:linear-gradient(160deg,#eef3f9 0%,#e4edf7 50%,#edeaf5 100%);
            padding:14px;max-width:100%;margin:0 auto;
            font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
            overflow-x:hidden;
            animation:fadeIn .3s cubic-bezier(.4,0,.2,1);
        }
        @keyframes fadeIn {from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

        .glow {
            position:fixed;width:500px;height:500px;border-radius:50%;
            background:radial-gradient(circle,rgba(140,120,255,.25) 0%,rgba(90,150,255,.15) 40%,transparent 70%);
            pointer-events:none;transform:translate(-50%,-50%);z-index:1;
            opacity:0;transition:opacity .3s ease;will-change:transform;
        }

        .header {
            position:relative;z-index:2;
            background:rgba(220,235,250,.7);
            backdrop-filter:blur(36px) saturate(220%);
            -webkit-backdrop-filter:blur(36px) saturate(220%);
            color:#1e3a5f;padding:20px;border-radius:26px;text-align:center;margin-bottom:14px;
            box-shadow:0 10px 40px rgba(50,100,180,.15);
            border:1px solid rgba(255,255,255,.9);
        }
        .header h2 {font-size:19px;font-weight:600;letter-spacing:.5px;}
        .header p {font-size:11px;opacity:.6;margin-top:6px;letter-spacing:3px;font-weight:400;}

        .full-wrap {position:relative;z-index:2;width:100%;}
        .model-container {
            position:relative;width:100%;height:420px;
            background:rgba(220,235,250,.7);
            backdrop-filter:blur(36px) saturate(220%);
            border-radius:26px;overflow:hidden;
            box-shadow:0 16px 48px rgba(50,100,180,.18);
            border:1px solid rgba(255,255,255,.9);
            will-change:height;
        }
        model-viewer {
            width:100%;height:100%;
            --poster-color:#e8f2fc;
            touch-action:pan-y;
            interpolation-decay:0.1;
            min-image-width:512;
        }
        model-viewer::part(ar-button),model-viewer::part(default-ar-button){display:none!important;}

        .toolbar{
            position:absolute;top:14px;right:14px;z-index:20;
            display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;
        }
        .btn{
            background:rgba(255,255,255,.65);
            backdrop-filter:blur(24px) saturate(220%);
            color:#2563a8;border:1px solid rgba(255,255,255,.9);
            border-radius:26px;padding:8px 16px;font-size:12px;cursor:pointer;
            box-shadow:0 4px 14px rgba(50,100,180,.12);
            transition:all .18s cubic-bezier(.4,0,.2,1);will-change:transform;
        }
        .btn:active{transform:scale(.94);}
        .btn.active{background:#2563a8;color:#fff;box-shadow:0 6px 20px rgba(37,99,168,.4);}

        .snap{
            position:absolute;bottom:18px;right:18px;z-index:20;
            width:46px;height:46px;border-radius:50%;
            background:rgba(255,255,255,.7);
            backdrop-filter:blur(24px) saturate(220%);
            border:1px solid rgba(255,255,255,.9);
            font-size:19px;cursor:pointer;
            box-shadow:0 8px 24px rgba(50,100,180,.2);
            display:flex;align-items:center;justify-content:center;
            transition:all .18s cubic-bezier(.4,0,.2,1);will-change:transform;
        }
        .snap:active{transform:scale(.9);}

        .full-wrap:fullscreen{
            background:linear-gradient(160deg,#eef3f9 0%,#e4edf7 100%);
            padding:16px;display:flex;flex-direction:column;
        }
        .full-wrap:fullscreen .model-container{
            flex:1;height:auto;background:rgba(220,235,250,.75);border-radius:20px;
        }
        .full-wrap:fullscreen .info-card{max-width:480px;margin:12px auto 0;}
        @media screen and (orientation:landscape){
            .full-wrap:fullscreen{flex-direction:row;gap:14px;}
            .full-wrap:fullscreen .model-container{flex:1;}
            .full-wrap:fullscreen .info-card{max-width:340px;margin:0;flex-shrink:0;overflow-y:auto;}
        }
        .full-wrap:fullscreen.panel-hidden .info-card{display:none;}

        .tip-banner{
            position:absolute;left:50%;transform:translateX(-50%);
            top:56px;z-index:21;color:#2563a8;font-size:12px;
            background:rgba(255,255,255,.88);backdrop-filter:blur(24px);
            padding:8px 18px;border-radius:26px;white-space:nowrap;
            box-shadow:0 8px 24px rgba(50,100,180,.18);transition:opacity .3s;
        }
        .toast{
            position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
            z-index:99;color:#2563a8;font-size:14px;font-weight:500;
            background:rgba(255,255,255,.92);backdrop-filter:blur(28px);
            padding:14px 28px;border-radius:26px;
            box-shadow:0 16px 48px rgba(50,100,180,.28);
            opacity:0;pointer-events:none;transition:opacity .25s;
        }
        .toast.show{opacity:1;}

        /* 顶部细进度条，固定在模型窗口最上方 */
        .progress{position:absolute;top:0;left:0;width:100%;height:6px;background:rgba(160,200,240,.3);z-index:11;overflow:hidden;}
        .bar{height:100%;width:0%;background:linear-gradient(90deg,#5b8def,#2563a8);transition:width .15s;}
        .loading{
            position:absolute;top:0;left:0;width:100%;height:100%;
            background:rgba(228,237,247,.7);backdrop-filter:blur(16px);
            display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;
        }
        .spinner{
            width:46px;height:46px;border:5px solid rgba(160,200,240,.4);
            border-top:5px solid #2563a8;border-radius:50%;
            animation:spin 1s linear infinite;
        }
        .loading-text{font-size:14px;color:#2563a8;margin-top:16px;font-weight:500;}
        .progress-percent{font-size:22px;font-weight:600;color:#2563a8;margin-top:6px;}
        @keyframes spin{to{transform:rotate(360deg)}}
        .error{display:none;position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(255,255,255,.92);flex-direction:column;align-items:center;justify-content:center;z-index:10;color:#557;}

        .info-card{
            background:rgba(220,235,250,.7);
            backdrop-filter:blur(36px) saturate(220%);
            -webkit-backdrop-filter:blur(36px) saturate(220%);
            padding:22px;border-radius:26px;margin-top:14px;
            box-shadow:0 10px 40px rgba(50,100,180,.15);
            border:1px solid rgba(255,255,255,.9);
        }
        .info-card h3{
            color:#1e3a5f;font-size:16px;margin-bottom:14px;
            padding-bottom:12px;border-bottom:1px solid rgba(50,100,180,.15);font-weight:600;
        }
        .row{display:flex;padding:12px 0;border-bottom:1px solid rgba(50,100,180,.06);font-size:14px;line-height:1.5;}
        .row:last-child{border-bottom:none;}
        .k{width:90px;color:#6088b8;flex-shrink:0;font-weight:400;}
        .v{flex:1;color:#1e3a5f;word-break:break-all;font-weight:500;}

        .footer{text-align:center;color:#7098c8;font-size:11px;margin-top:18px;line-height:1.7;}
        .hide{display:none!important;}
    </style>
</head>
<body>
<div class="glow" id="glow"></div>
<div class="toast" id="toast">✅ 截图已保存</div>

<div class="header">
    <h2>中铁装配｜钢结构构件信息</h2>
    <p>CHINA RAILWAY ASSEMBLY</p>
</div>

<div class="full-wrap" id="fullWrap">
    <div class="tip-banner hide" id="tipBanner">💡微信内点右上角「在浏览器打开」可横屏查看</div>
    <div class="model-container">
        <!-- 顶部细进度条 -->
        <div class="progress"><div class="bar" id="bar"></div></div>
        <model-viewer id="viewer" alt="构件3D模型" shadow-intensity="0.5" camera-controls interaction-prompt="auto"></model-viewer>
        <div class="toolbar">
            <button class="btn" id="btnRotate">自动旋转</button>
            <button class="btn" id="btnReset">重置视角</button>
            <button class="btn" id="btnFull">⛶全屏</button>
            <button class="btn hide" id="btnToggle">隐藏信息</button>
        </div>
        <button class="snap" id="btnSnap">📷</button>
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div class="loading-text">正在加载3D模型</div>
            <div class="progress-percent" id="percent">0%</div>
        </div>
        <div class="error" id="error">
            <p>3D模型加载失败，请检查网络刷新</p>
        </div>
    </div>

    <div class="info-card" id="infoCard">
        <h3>构件基本信息</h3>
        <div class="row"><div class="k">构件编号</div><div class="v" id="partId">-</div></div>
        <div class="row"><div class="k">加工号</div><div class="v" id="workNo">-</div></div>
        <div class="row"><div class="k">项目名称</div><div class="v" id="projectName">-</div></div>
        <div class="row"><div class="k">分部工程</div><div class="v" id="section">-</div></div>
        <div class="row"><div class="k">构件类型</div><div class="v" id="partType">-</div></div>
        <div class="row"><div class="k">材质</div><div class="v" id="material">-</div></div>
        <div class="row"><div class="k">规格</div><div class="v" id="spec">-</div></div>
        <div class="row"><div class="k">数量</div><div class="v" id="quantity">-</div></div>
    </div>
</div>

<p class="footer">中铁装配 · 钢结构构件一物一码系统<br>制作人：赵文杰</p>

<script src="data.js"></script>
<script>
const $ = s => document.querySelector(s);
const id = new URLSearchParams(location.search).get('id');
const viewer = $('#viewer'), loading = $('#loading'), bar = $('#bar'), percent = $('#percent'),
error = $('#error'), fullWrap = $('#fullWrap'), btnFull = $('#btnFull'), btnToggle = $('#btnToggle'),
btnRotate = $('#btnRotate'), btnReset = $('#btnReset'), infoCard = $('#infoCard'), tipBanner = $('#tipBanner'),
glow = $('#glow'), btnSnap = $('#btnSnap'), toast = $('#toast');

let rotate = false, tipTimer = null, retryCount = 0, progressTimer = null;
const fields = ['partId','workNo','projectName','section','partType','material','spec','quantity'];

if(id && partData[id]){
    const d = partData[id];
    fields.forEach(f => {const el = $(`#${f}`); if(el && d[f]) el.innerText = d[f];});
    
    // 提前设置模型预加载地址，浏览器一打开就开始下载模型
    document.getElementById('modelPreload').href = d.glbUrl;
    
    // 平滑模拟进度：从0慢慢涨到90%，等真实加载完再跳100%
    let fakeProgress = 0;
    progressTimer = setInterval(() => {
        if(fakeProgress < 90){
            fakeProgress += Math.random()*8 + 2;
            if(fakeProgress > 90) fakeProgress = 90;
            bar.style.width = fakeProgress + '%';
            percent.innerText = Math.round(fakeProgress) + '%';
        }
    }, 150);

    function loadModel(){
        viewer.src = d.glbUrl;
        viewer.autoRotateSpeed = 3;
    }
    loadModel();

    viewer.addEventListener('load', () => {
        clearInterval(progressTimer);
        bar.style.width = '100%';
        percent.innerText = '100%';
        setTimeout(()=>loading.style.display = 'none', 200);
    });
    viewer.addEventListener('error', () => {
        clearInterval(progressTimer);
        if(retryCount < 1){retryCount++; setTimeout(loadModel, 1000);}
        else {loading.style.display='none'; error.style.display='flex';}
    });
}else{
    document.querySelector('.header h2').innerText = '构件信息未找到';
    document.querySelector('.model-container').style.display = 'none';
    loading.style.display = 'none';
}

btnSnap.onclick = async () => {
    try{
        const blob = await viewer.toBlob({imageType:'png',quality:.95});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `构件${id}_模型视图.png`; a.click();
        URL.revokeObjectURL(url);
        toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'),1800);
    }catch(e){alert('截图失败，请手动截屏');}
}

function moveGlow(x,y){glow.style.left=x+'px';glow.style.top=y+'px';glow.style.opacity='1';}
document.addEventListener('mousemove',e=>moveGlow(e.clientX,e.clientY));
document.addEventListener('touchmove',e=>{if(e.touches[0])moveGlow(e.touches[0].clientX,e.touches[0].clientY);});
document.addEventListener('mouseleave',()=>glow.style.opacity='0');

btnRotate.onclick = () => {
    rotate = !rotate; viewer.autoRotate = rotate;
    btnRotate.classList.toggle('active',rotate);
    btnRotate.innerText = rotate ? "旋转中" : "自动旋转";
}
btnReset.onclick = () => {viewer.cameraOrbit = "0deg 75deg 105%"; viewer.cameraTarget = "auto";}
btnFull.onclick = async () => {
    try{
        if(!document.fullscreenElement){
            await fullWrap.requestFullscreen();
            btnToggle.classList.remove('hide'); tipBanner.classList.remove('hide');
            tipTimer = setTimeout(()=>tipBanner.classList.add('hide'),5000);
            btnFull.innerText = "⤢退出全屏";
        }else document.exitFullscreen();
    }catch(e){}
}
document.addEventListener('fullscreenchange',()=>{
    if(!document.fullscreenElement){
        btnToggle.classList.add('hide'); tipBanner.classList.add('hide');
        fullWrap.classList.remove('panel-hidden'); infoCard.classList.remove('hide');
        clearTimeout(tipTimer); btnFull.innerText = "⛶全屏";
    }
});
btnToggle.onclick = () => {
    const h = infoCard.classList.toggle('hide');
    fullWrap.classList.toggle('panel-hidden',h);
    btnToggle.innerText = h ? "显示信息" : "隐藏信息";
}
tipBanner.onclick = () => {tipBanner.classList.add('hide');clearTimeout(tipTimer);}
</script>
</body>
</html>
