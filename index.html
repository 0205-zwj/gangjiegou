<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>中铁装配 钢结构构件信息</title>
    <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft Yahei",sans-serif;}
        body {background:#f4f5f7;padding:12px;max-width:100%;margin:0 auto;}
        .header {background:#00529B;color:#fff;padding:14px;border-radius:8px;text-align:center;margin-bottom:12px;}
        .header h2 {font-size:17px;}
        .header p {font-size:12px;opacity:0.9;margin-top:4px;}

        /* 3D外层容器，用于自定义全屏 */
        .full-wrap {position:relative;width:100%;}
        .model-container {position:relative;width:100%;height:380px;background:#e8e8e8;border-radius:8px;overflow:hidden;}
        model-viewer {width:100%;height:100%;--poster-color:#e8e8e8;}

        /* 自定义控制按钮组 */
        .viewer-toolbar{
            position:absolute;top:8px;right:8px;z-index:20;
            display:flex;gap:6px;
        }
        .tool-btn{
            background:rgba(0,0,0,0.45);
            color:#fff;border:none;border-radius:4px;
            padding:6px 9px;font-size:13px;cursor:pointer;
        }
        .tool-btn:hover{background:rgba(0,0,0,0.65);}

        /* 全屏模式样式 */
        .full-wrap:fullscreen{
            background:#000;
            padding:12px;
        }
        .full-wrap:fullscreen .model-container{
            height:calc(100vh - 220px);
            border-radius:6px;
        }
        .full-wrap:fullscreen .info-card{
            max-width:420px;
            margin:10px auto 0;
        }

        /* 加载遮罩层 */
        .loading-mask {position:absolute;top:0;left:0;width:100%;height:100%;background:#f0f2f5;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;}
        .loading-text {font-size:14px;color:#666;margin-top:16px;}
        .loading-progress {width:60%;height:6px;background:#e0e0e0;border-radius:3px;margin-top:12px;overflow:hidden;}
        .progress-bar {height:100%;width:0%;background:#00529B;transition:width 0.3s;}
        .spinner {width:40px;height:40px;border:4px solid #e0e0e0;border-top:4px solid #00529B;border-radius:50%;animation:spin 1s linear infinite;}
        @keyframes spin {0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
        .error-tip {display:none;position:absolute;top:0;left:0;width:100%;height:100%;background:#fff;flex-direction:column;align-items:center;justify-content:center;z-index:10;color:#666;font-size:14px;}

        .info-card {background:#fff;padding:14px;border-radius:8px;margin-top:12px;box-shadow:0 1px 4px rgba(0,0,0,0.06);transition:0.2s;}
        .info-card h3 {color:#00529B;font-size:15px;margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid #00529B;}
        .info-item {display:flex;padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:13px;}
        .info-item:last-child {border-bottom:none;}
        .label {width:90px;color:#888;flex-shrink:0;}
        .value {flex:1;color:#222;word-break:break-all;}

        .tip {text-align:center;color:#999;font-size:11px;margin-top:14px;}
        .hide{display:none !important;}
    </style>
</head>
<body>
<div class="header">
    <h2>中铁装配｜钢结构构件信息</h2>
    <p>CHINA RAILWAY ASSEMBLY</p>
</div>

<div class="full-wrap" id="fullWrap">
    <div class="model-container">
        <model-viewer id="viewer" alt="构件3D模型" shadow-intensity="1" camera-controls interaction-prompt="auto" ar></model-viewer>
        <!-- 工具栏按钮 -->
        <div class="viewer-toolbar">
            <button class="tool-btn" id="btnAutoRotate">自动旋转 关</button>
            <button class="tool-btn" id="btnResetCam">重置视角</button>
            <button class="tool-btn" id="btnFull">⛶全屏</button>
            <button class="tool-btn hide" id="btnPanelToggle">隐藏信息</button>
        </div>
        <div class="loading-mask" id="loadingMask">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">正在加载3D模型...</div>
            <div class="loading-progress">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>
        <div class="error-tip" id="errorTip">
            <p>3D模型加载失败，请检查网络后刷新</p>
        </div>
    </div>

    <div class="info-card" id="infoCard">
        <h3>构件基本信息</h3>
        <div class="info-item"><div class="label">构件编号</div><div class="value"><span id="partId">-</span></div></div>
        <div class="info-item"><div class="label">加工号</div><div class="value"><span id="workNo">-</span></div></div>
        <div class="info-item"><div class="label">项目名称</div><div class="value"><span id="projectName">-</span></div></div>
        <div class="info-item"><div class="label">分部工程</div><div class="value"><span id="section">-</span></div></div>
        <div class="info-item"><div class="label">构件类型</div><div class="value"><span id="partType">-</span></div></div>
        <div class="info-item"><div class="label">材质</div><div class="value"><span id="material">-</span></div></div>
        <div class="info-item"><div class="label">规格</div><div class="value"><span id="spec">-</span></div></div>
        <div class="info-item"><div class="label">数量</div><div class="value"><span id="quantity">-</span></div></div>
    </div>
</div>

<p class="tip">中铁装配 · 钢结构构件一物一码系统<br>制作人：赵文杰</p>

<script src="data.js"></script>
<script>
const urlParams = new URLSearchParams(window.location.search);
const id = urlParams.get('id');
const viewer = document.getElementById('viewer');
const loadingMask = document.getElementById('loadingMask');
const loadingText = document.getElementById('loadingText');
const progressBar = document.getElementById('progressBar');
const errorTip = document.getElementById('errorTip');
const fullWrap = document.getElementById('fullWrap');
const btnFull = document.getElementById('btnFull');
const btnPanelToggle = document.getElementById('btnPanelToggle');
const btnAutoRotate = document.getElementById('btnAutoRotate');
const btnResetCam = document.getElementById('btnResetCam');
const infoCard = document.getElementById('infoCard');

let autoRotateState = false;
const fields = ['partId','workNo','projectName','section','partType','material','spec','quantity'];

if (id && window.partData && window.partData[id]) {
    const d = window.partData[id];
    //填充信息
    fields.forEach(f => {
        if (document.getElementById(f) && d[f]) document.getElementById(f).innerText = d[f];
    });

    viewer.src = d.glbUrl;

    viewer.addEventListener('progress', (e) => {
        if (e.total) {
            const percent = Math.round((e.loaded / e.total) * 100);
            progressBar.style.width = percent + '%';
            loadingText.innerText = `正在加载3D模型... ${percent}%`;
        }
    });
    viewer.addEventListener('load', () => { loadingMask.style.display = 'none'; });
    viewer.addEventListener('error', () => {
        loadingMask.style.display = 'none';
        errorTip.style.display = 'flex';
    });
}else{
    document.querySelector('.header h2').innerText = '构件信息未找到';
    document.querySelector('.model-container').style.display = 'none';
    loadingMask.style.display = 'none';
}

// 全屏按钮
btnFull.addEventListener('click',async ()=>{
    try{
        if(!document.fullscreenElement){
            await fullWrap.requestFullscreen();
            btnPanelToggle.classList.remove('hide');
            btnFull.innerText="⤢退出全屏";
        }else{
            await document.exitFullscreen();
            btnPanelToggle.classList.add('hide');
            btnFull.innerText="⛶全屏";
            infoCard.classList.remove('hide');
        }
    }catch(e){console.warn("全屏异常",e)}
})
// ESC退出全屏监听
document.addEventListener('fullscreenchange',()=>{
    if(!document.fullscreenElement){
        btnPanelToggle.classList.add('hide');
        btnFull.innerText="⛶全屏";
        infoCard.classList.remove('hide');
    }
})
// 全屏模式切换信息面板显示隐藏
btnPanelToggle.addEventListener('click',()=>{
    if(infoCard.classList.contains('hide')){
        infoCard.classList.remove('hide');
        btnPanelToggle.innerText="隐藏信息";
    }else{
        infoCard.classList.add('hide');
        btnPanelToggle.innerText="显示信息";
    }
})
// 自动旋转开关
btnAutoRotate.addEventListener('click',()=>{
    autoRotateState = !autoRotateState;
    viewer.autoRotate = autoRotateState;
    btnAutoRotate.innerText = autoRotateState ? "自动旋转 开":"自动旋转 关";
})
// 重置相机视角
btnResetCam.addEventListener('click',()=>{viewer.cameraOrbit = "0deg 75deg 105%";})
</script>
</body>
</html>
