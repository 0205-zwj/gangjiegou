<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>中铁装配 钢结构构件信息</title>
    <script type="module" defer src="https://cdn.bootcdn.net/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
        html,body{height:100%;}
        body {
            background:linear-gradient(160deg,#eef6ff 0%,#f8fbff 50%,#fff5f7 100%);
            padding:14px;max-width:100%;margin:0 auto;
            font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
            overflow-x:hidden;
            animation:fadeIn .35s cubic-bezier(.4,0,.2,1);
        }
        @keyframes fadeIn {from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

        /* 丝滑跟手柔光光晕 */
        .glow {
            position:fixed;width:420px;height:420px;border-radius:50%;
            background:radial-gradient(circle,rgba(0,140,255,.18) 0%,rgba(0,140,255,.06) 40%,transparent 70%);
            pointer-events:none;transform:translate(-50%,-50%);z-index:1;
            opacity:0;transition:opacity .25s ease;will-change:transform;
        }

        /* 头部卡片 */
        .header {
            position:relative;z-index:2;
            background:rgba(255,255,255,.72);
            backdrop-filter:blur(24px) saturate(180%);
            -webkit-backdrop-filter:blur(24px) saturate(180%);
            color:#0050a0;padding:20px;border-radius:26px;text-align:center;margin-bottom:14px;
            box-shadow:0 8px 32px rgba(0,100,200,.1);
            border:1px solid rgba(255,255,255,.9);
        }
        .header h2 {font-size:19px;font-weight:600;letter-spacing:.5px;}
        .header p {font-size:11px;opacity:.6;margin-top:6px;letter-spacing:3px;font-weight:400;}

        .full-wrap {position:relative;z-index:2;width:100%;}
        .model-container {
            position:relative;width:100%;height:420px;
            background:rgba(255,255,255,.65);
            backdrop-filter:blur(20px) saturate(160%);
            border-radius:26px;overflow:hidden;
            box-shadow:0 12px 40px rgba(0,100,200,.12);
            border:1px solid rgba(255,255,255,.9);
            will-change:height;
        }
        model-viewer {width:100%;height:100%;--poster-color:#f0f7ff;}
        model-viewer::part(ar-button),model-viewer::part(default-ar-button){display:none!important;}

        /* 右上角工具栏，澎湃OS风格圆角胶囊按钮 */
        .toolbar{
            position:absolute;top:14px;right:14px;z-index:20;
            display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;
        }
        .btn{
            background:rgba(255,255,255,.6);
            backdrop-filter:blur(16px) saturate(180%);
            color:#0066cc;border:1px solid rgba(255,255,255,.8);
            border-radius:26px;padding:8px 16px;font-size:12px;cursor:pointer;
            box-shadow:0 4px 12px rgba(0,100,200,.08);
            transition:all .18s cubic-bezier(.4,0,.2,1);will-change:transform;
        }
        .btn:active{transform:scale(.94);}
        .btn.active{background:#0078ed;color:#fff;box-shadow:0 6px 16px rgba(0,120,237,.35);}

        /* 右下角圆形截图按钮 */
        .snap{
            position:absolute;bottom:18px;right:18px;z-index:20;
            width:46px;height:46px;border-radius:50%;
            background:rgba(255,255,255,.65);
            backdrop-filter:blur(16px) saturate(180%);
            border:1px solid rgba(255,255,255,.8);
            font-size:19px;cursor:pointer;
            box-shadow:0 6px 20px rgba(0,100,200,.15);
            display:flex;align-items:center;justify-content:center;
            transition:all .18s cubic-bezier(.4,0,.2,1);will-change:transform;
        }
        .snap:active{transform:scale(.9);}

        /* 全屏模式 */
        .full-wrap:fullscreen{
            background:linear-gradient(160deg,#eef6ff 0%,#f8fbff 100%);
            padding:16px;display:flex;flex-direction:column;
        }
        .full-wrap:fullscreen .model-container{
            flex:1;height:auto;background:rgba(255,255,255,.7);border-radius:20px;
        }
        .full-wrap:fullscreen .info-card{max-width:480px;margin:12px auto 0;}
        @media screen and (orientation:landscape){
            .full-wrap:fullscreen{flex-direction:row;gap:14px;}
            .full-wrap:fullscreen .model-container{flex:1;}
            .full-wrap:fullscreen .info-card{max-width:340px;margin:0;flex-shrink:0;overflow-y:auto;}
        }
        .full-wrap:fullscreen.panel-hidden .info-card{display:none;}

        /* 提示 */
        .tip-banner{
            position:absolute;left:50%;transform:translateX(-50%);
            top:56px;z-index:21;color:#0066cc;font-size:12px;
            background:rgba(255,255,255,.8);backdrop-filter:blur(16px);
            padding:8px 18px;border-radius:26px;white-space:nowrap;
            box-shadow:0 6px 20px rgba(0,100,200,.12);transition:opacity .3s;
        }
        .toast{
            position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
            z-index:99;color:#0078ed;font-size:14px;font-weight:500;
            background:rgba(255,255,255,.9);backdrop-filter:blur(20px);
            padding:14px 28px;border-radius:26px;
            box-shadow:0 12px 40px rgba(0,100,200,.2);
            opacity:0;pointer-events:none;transition:opacity .25s;
        }
        .toast.show{opacity:1;}

        /* 加载遮罩 */
        .loading{
            position:absolute;top:0;left:0;width:100%;height:100%;
            background:rgba(240,248,255,.92);backdrop-filter:blur(16px);
            display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;
        }
        .loading-text{font-size:14px;color:#0078ed;margin-top:18px;font-weight:500;}
        .progress{width:70%;height:5px;background:rgba(180,220,255,.5);border-radius:3px;margin-top:14px;overflow:hidden;}
        .bar{height:100%;width:0%;background:linear-gradient(90deg,#00a2ff,#0078ed);transition:width .3s;}
        .spinner{
            width:46px;height:46px;border:4px solid rgba(180,220,255,.4);
            border-top:4px solid #0078ed;border-radius:50%;
            animation:spin 1s linear infinite;
        }
        @keyframes spin{to{transform:rotate(360deg)}}
        .error{display:none;position:absolute;top:0;left:0;width:100%;height:100%;background:#fff;flex-direction:column;align-items:center;justify-content:center;z-index:10;color:#668;}

        /* 信息卡片 */
        .info-card{
            background:rgba(255,255,255,.75);
            backdrop-filter:blur(24px) saturate(180%);
            -webkit-backdrop-filter:blur(24px) saturate(180%);
            padding:22px;border-radius:26px;margin-top:14px;
            box-shadow:0 8px 32px rgba(0,100,200,.1);
            border:1px solid rgba(255,255,255,.9);
        }
        .info-card h3{
            color:#0050a0;font-size:16px;margin-bottom:14px;
            padding-bottom:12px;border-bottom:1px solid rgba(0,100,200,.1);font-weight:600;
        }
        .row{display:flex;padding:11px 0;border-bottom:1px solid rgba(0,100,200,.04);font-size:14px;}
        .row:last-child{border-bottom:none;}
        .k{width:90px;color:#7098c8;flex-shrink:0;font-weight:400;}
        .v{flex:1;color:#1a3a60;word-break:break-all;font-weight:500;}

        .footer{text-align:center;color:#88a8d0;font-size:11px;margin-top:18px;line-height:1.7;}
        .hide{display:none!important;}
    </style>
</head>
<body>
<div class="glow" id="glow"></div>
<div class="toast" id="toast">✅ 截图已保存</div>

<div class="header">
    <h2>中铁装配｜钢结构构件信息</h2>
    <p>CHINA RAILWAY ASSEMBLY</p>
</div>

<div class="full-wrap" id="fullWrap">
    <div class="tip-banner hide" id="tipBanner">💡微信内点右上角「在浏览器打开」可横屏查看</div>
    <div class="model-container">
        <model-viewer id="viewer" alt="构件3D模型" shadow-intensity="1" camera-controls interaction-prompt="auto"></model-viewer>
        <div class="toolbar">
            <button class="btn" id="btnRotate">自动旋转</button>
            <button class="btn" id="btnReset">重置视角</button>
            <button class="btn" id="btnFull">⛶全屏</button>
            <button class="btn hide" id="btnToggle">隐藏信息</button>
        </div>
        <button class="snap" id="btnSnap">📷</button>
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div class="loading-text" id="loadText">正在加载3D模型...</div>
            <div class="progress"><div class="bar" id="bar"></div></div>
        </div>
        <div class="error" id="error">
            <p>3D模型加载失败，请检查网络刷新</p>
        </div>
    </div>

    <div class="info-card" id="infoCard">
        <h3>构件基本信息</h3>
        <div class="row"><div class="k">构件编号</div><div class="v" id="partId">-</div></div>
        <div class="row"><div class="k">加工号</div><div class="v" id="workNo">-</div></div>
        <div class="row"><div class="k">项目名称</div><div class="v" id="projectName">-</div></div>
        <div class="row"><div class="k">分部工程</div><div class="v" id="section">-</div></div>
        <div class="row"><div class="k">构件类型</div><div class="v" id="partType">-</div></div>
        <div class="row"><div class="k">材质</div><div class="v" id="material">-</div></div>
        <div class="row"><div class="k">规格</div><div class="v" id="spec">-</div></div>
        <div class="row"><div class="k">数量</div><div class="v" id="quantity">-</div></div>
    </div>
</div>

<p class="footer">中铁装配 · 钢结构构件一物一码系统<br>制作人：赵文杰</p>

<script src="data.js"></script>
<script>
const $ = s => document.querySelector(s);
const id = new URLSearchParams(location.search).get('id');
const viewer = $('#viewer'), loading = $('#loading'), bar = $('#bar'), loadText = $('#loadText'),
error = $('#error'), fullWrap = $('#fullWrap'), btnFull = $('#btnFull'), btnToggle = $('#btnToggle'),
btnRotate = $('#btnRotate'), btnReset = $('#btnReset'), infoCard = $('#infoCard'), tipBanner = $('#tipBanner'),
glow = $('#glow'), btnSnap = $('#btnSnap'), toast = $('#toast');

let rotate = false, tipTimer = null;
const fields = ['partId','workNo','projectName','section','partType','material','spec','quantity'];

if(id && partData[id]){
    const d = partData[id];
    fields.forEach(f => {const el = $(`#${f}`); if(el && d[f]) el.innerText = d[f];});
    viewer.src = d.glbUrl;
    viewer.autoRotateSpeed = 3;
    viewer.addEventListener('progress', e => {
        if(e.total){
            const p = Math.round(e.loaded/e.total*100);
            bar.style.width = p+'%';
            loadText.innerText = `正在加载3D模型... ${p}%`;
        }
    });
    viewer.addEventListener('load', () => loading.style.display = 'none');
    viewer.addEventListener('error', () => {loading.style.display='none'; error.style.display='flex';});
}else{
    document.querySelector('.header h2').innerText = '构件信息未找到';
    document.querySelector('.model-container').style.display = 'none';
    loading.style.display = 'none';
}

// 截图功能
btnSnap.onclick = async () => {
    try{
        const blob = await viewer.toBlob({imageType:'png',quality:.95});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `构件${id}_模型视图.png`; a.click();
        URL.revokeObjectURL(url);
        toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'),1800);
    }catch(e){alert('截图失败，请手动截屏');}
}

// 跟手光晕
function moveGlow(x,y){glow.style.left=x+'px';glow.style.top=y+'px';glow.style.opacity='1';}
document.addEventListener('mousemove',e=>moveGlow(e.clientX,e.clientY));
document.addEventListener('touchmove',e=>{if(e.touches[0])moveGlow(e.touches[0].clientX,e.touches[0].clientY);});
document.addEventListener('mouseleave',()=>glow.style.opacity='0');

// 自动旋转
btnRotate.onclick = () => {
    rotate = !rotate; viewer.autoRotate = rotate;
    btnRotate.classList.toggle('active',rotate);
    btnRotate.innerText = rotate ? "旋转中" : "自动旋转";
}
// 重置视角
btnReset.onclick = () => {viewer.cameraOrbit = "0deg 75deg 105%"; viewer.cameraTarget = "auto";}
// 全屏
btnFull.onclick = async () => {
    try{
        if(!document.fullscreenElement){
            await fullWrap.requestFullscreen();
            btnToggle.classList.remove('hide'); tipBanner.classList.remove('hide');
            tipTimer = setTimeout(()=>tipBanner.classList.add('hide'),5000);
            btnFull.innerText = "⤢退出全屏";
        }else document.exitFullscreen();
    }catch(e){}
}
// 退出全屏监听
document.addEventListener('fullscreenchange',()=>{
    if(!document.fullscreenElement){
        btnToggle.classList.add('hide'); tipBanner.classList.add('hide');
        fullWrap.classList.remove('panel-hidden'); infoCard.classList.remove('hide');
        clearTimeout(tipTimer); btnFull.innerText = "⛶全屏";
    }
});
// 隐藏信息
btnToggle.onclick = () => {
    const h = infoCard.classList.toggle('hide');
    fullWrap.classList.toggle('panel-hidden',h);
    btnToggle.innerText = h ? "显示信息" : "隐藏信息";
}
tipBanner.onclick = () => {tipBanner.classList.add('hide');clearTimeout(tipTimer);}
</script>
</body>
</html>
