<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>中铁装配 钢结构构件信息</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%232563a8%22/><path d=%22M50 24 L76 38 L76 64 L50 78 L24 64 L24 38 Z%22 fill=%22none%22 stroke=%22white%22 stroke-width=%225%22 stroke-linejoin=%22round%22/><path d=%22M50 24 L50 51 M24 38 L50 51 L76 38 M50 51 L50 78%22 fill=%22none%22 stroke=%22white%22 stroke-width=%225%22 stroke-linejoin=%22round%22/></svg>">
    <link rel="preconnect" href="https://cdn.bootcdn.net" crossorigin>
    <link rel="preconnect" href="https://gcore.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <script type="module" defer src="https://cdn.bootcdn.net/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
        html,body{height:100%;overscroll-behavior:none;}
        body {
            background:linear-gradient(160deg,#eef3f9 0%,#e4edf7 50%,#edeaf5 100%);
            padding:14px;max-width:100%;margin:0 auto;
            font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
            overflow-x:hidden;
            animation:pageIn .5s cubic-bezier(.22,1,.36,1);
        }
        @keyframes pageIn {from{opacity:0;transform:translateY(12px) scale(.99)}to{opacity:1;transform:translateY(0) scale(1)}}
        .glow {
            position:fixed;left:0;top:0;width:480px;height:480px;border-radius:50%;
            background:radial-gradient(circle,rgba(140,120,255,.22) 0%,rgba(90,150,255,.14) 40%,transparent 70%);
            pointer-events:none;transform:translate(-50%,-50%);z-index:1;
            opacity:0;transition:opacity .4s ease,width .3s ease,height .3s ease;will-change:transform;
        }
        body.in-fs .glow{opacity:0!important;}
        .header {
            position:relative;z-index:2;
            background:rgba(220,235,250,.65);
            backdrop-filter:blur(36px) saturate(220%);
            -webkit-backdrop-filter:blur(36px) saturate(220%);
            color:#1e3a5f;padding:14px 16px;border-radius:22px;text-align:center;margin-bottom:10px;
            box-shadow:0 8px 32px rgba(50,100,180,.12), 0 0 24px rgba(140,180,255,.25);
            border:1px solid rgba(255,255,255,.85);
            transition:opacity .35s ease;
        }
        .header h2 {font-size:17px;font-weight:600;letter-spacing:.5px;}
        .header p {font-size:10px;opacity:.6;margin-top:4px;letter-spacing:2px;font-weight:400;}
        .full-wrap {position:relative;z-index:2;width:100%;}
        .model-container {
            position:relative;width:100%;height:520px;
            background:rgba(220,235,250,.65);
            backdrop-filter:blur(36px) saturate(220%);
            border-radius:26px;overflow:hidden;
            box-shadow:0 16px 48px rgba(50,100,180,.15), 0 0 32px rgba(140,180,255,.28);
            border:1px solid rgba(255,255,255,.85);
            transition:box-shadow .35s ease,border-color .35s ease;
        }
        .model-container:hover{
            border-color:rgba(178,196,246,.9);
            box-shadow:0 20px 54px rgba(50,100,180,.17), 0 0 42px rgba(150,168,242,.4);
        }
        model-viewer {
            width:100%;height:100%;
            --poster-color:#e8f2fc;
            touch-action:none;
            interpolation-decay:0.12;
            min-image-width:512;
            camera-orbit:0deg 75deg auto;
            camera-target:0m 0m 0m;
            field-of-view:30deg;
            min-field-of-view:5deg;
            max-field-of-view:80deg;
            polar-min:-90deg;
            polar-max:270deg;
        }
        model-viewer::part(ar-button),model-viewer::part(default-ar-button){display:none!important;}
        .toolbar{
            position:absolute;right:12px;top:50%;transform:translateY(-50%);z-index:20;
            display:flex;flex-direction:column;gap:10px;align-items:center;
            transition:opacity .3s ease;
        }
        .btn{
            width:42px;height:42px;border-radius:50%;
            background:rgba(255,255,255,.6);
            backdrop-filter:blur(24px) saturate(220%);
            -webkit-backdrop-filter:blur(24px) saturate(220%);
            color:#2563a8;border:1px solid rgba(255,255,255,.9);
            font-size:18px;cursor:pointer;
            box-shadow:0 4px 14px rgba(50,100,180,.1);
            transition:transform .2s cubic-bezier(.22,1,.36,1), background .25s ease;
            display:flex;align-items:center;justify-content:center;
        }
        .btn:active{transform:scale(.88);transition-duration:.1s;}
        .btn.active{background:#2563a8;color:#fff;box-shadow:0 6px 20px rgba(37,99,168,.4);}
        .tip-banner{
            position:absolute;left:50%;transform:translateX(-50%) translateY(-8px);
            top:20px;z-index:21;color:#2563a8;font-size:12px;
            background:rgba(255,255,255,.85);backdrop-filter:blur(24px);
            padding:8px 18px;border-radius:26px;white-space:nowrap;
            box-shadow:0 8px 24px rgba(50,100,180,.15);
            opacity:0;pointer-events:none;
            transition:opacity .35s ease, transform .45s cubic-bezier(.22,1,.36,1);
        }
        .tip-banner.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}
        .toast{
            position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);
            z-index:9300;color:#2563a8;font-size:14px;font-weight:500;
            background:rgba(255,255,255,.92);backdrop-filter:blur(28px);
            padding:14px 28px;border-radius:26px;
            box-shadow:0 16px 48px rgba(50,100,180,.25);
            opacity:0;pointer-events:none;
            transition:opacity .3s ease, transform .35s cubic-bezier(.22,1,.36,1);
        }
        .toast.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
        .model-list{
            position:fixed;left:0;right:0;bottom:0;z-index:9201;
            background:rgba(238,243,249,.96);
            backdrop-filter:blur(40px) saturate(200%);
            -webkit-backdrop-filter:blur(40px) saturate(200%);
            border-radius:28px 28px 0 0;padding:20px 16px calc(30px + env(safe-area-inset-bottom));
            max-height:80vh;overflow-y:auto;
            transform:translateY(105%);
            transition:transform .5s cubic-bezier(.22,1,.36,1);
            box-shadow:0 -12px 48px rgba(50,100,180,.2);
        }
        .model-list.show{transform:translateY(0);}
        .model-list h3{color:#1e3a5f;font-size:15px;margin-bottom:6px;text-align:center;font-weight:600;}
        .model-list .drag-handle{width:36px;height:4px;border-radius:2px;background:rgba(100,140,200,.25);margin:0 auto 16px;}
        #modelItems{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
        .model-item{
            padding:14px;background:rgba(255,255,255,.75);border-radius:16px;
            cursor:pointer;transition:transform .25s cubic-bezier(.22,1,.36,1), box-shadow .25s ease;
            box-shadow:0 4px 16px rgba(50,100,180,.08);
            border:1px solid rgba(255,255,255,.9);
            opacity:0;transform:translateY(16px);
        }
        .model-list.show .model-item{opacity:1;transform:translateY(0);transition:opacity .4s ease, transform .45s cubic-bezier(.22,1,.36,1);}
        .model-item:active{transform:scale(.96);transition-duration:.1s;}
        .model-item .mid{color:#1e3a5f;font-size:13px;font-weight:600;}
        .model-item .mname{color:#6088b8;font-size:10px;margin-top:3px;line-height:1.3;}
        .model-mask{
            position:fixed;inset:0;background:rgba(30,50,90,.2);z-index:9200;
            opacity:0;pointer-events:none;transition:opacity .4s ease;
            backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
        }
        .model-mask.show{opacity:1;pointer-events:auto;}
        .progress{position:absolute;top:0;left:0;width:100%;height:3px;background:rgba(160,200,240,.2);z-index:11;overflow:hidden;transition:opacity .4s ease;}
        .progress.done{opacity:0;}
        .bar{
            height:100%;width:0%;
            background:linear-gradient(90deg,#7ba8f0,#2563a8,#7ba8f0);
            background-size:200% 100%;
            box-shadow:0 0 10px rgba(123,168,240,.8);
            transition:width .3s ease;
            animation:barFlow 2s linear infinite;
        }
        @keyframes barFlow{0%{background-position:0% 0;}100%{background-position:200% 0;}}
        .loading{
            position:absolute;top:0;left:0;width:100%;height:100%;
            background:rgba(228,237,247,.55);
            backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
            display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;
            transition:opacity .45s ease;
        }
        .loading-ring{position:relative;width:60px;height:60px;}
        .loading-ring .ring{position:absolute;inset:0;border-radius:50%;border:3px solid transparent;}
        .loading-ring .ring1{border-top-color:#2563a8;animation:spin 1s cubic-bezier(.5,.1,.5,.9) infinite;}
        .loading-ring .ring2{inset:8px;border-width:2px;border-bottom-color:rgba(123,168,240,.6);animation:spinReverse 1.5s cubic-bezier(.5,.1,.5,.9) infinite;}
        .loading-ring .ring3{inset:16px;border-width:2px;border-left-color:rgba(140,180,255,.4);animation:spin .8s linear infinite;}
        @keyframes spinReverse{to{transform:rotate(-360deg);}}
        .loading-text{font-size:14px;color:#2563a8;margin-top:20px;font-weight:500;letter-spacing:.5px;}
        .loading-sub{font-size:11px;color:#7098c8;margin-top:6px;opacity:.7;}
        .progress-percent{font-size:26px;font-weight:700;color:#2563a8;margin-top:10px;letter-spacing:-1px;}
        @keyframes spin{to{transform:rotate(360deg)}}
        .error{display:none;position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(255,255,255,.92);flex-direction:column;align-items:center;justify-content:center;z-index:10;color:#557;}
        .info-card{
            background:rgba(220,235,250,.65);
            backdrop-filter:blur(36px) saturate(220%);
            -webkit-backdrop-filter:blur(36px) saturate(220%);
            padding:18px;border-radius:26px;margin-top:14px;
            display:flex;flex-direction:column;gap:9px;
            box-shadow:0 10px 40px rgba(50,100,180,.12), 0 0 24px rgba(140,180,255,.25);
            border:1px solid rgba(255,255,255,.85);
            transition:opacity .4s ease, transform .45s cubic-bezier(.22,1,.36,1), box-shadow .35s ease, border-color .35s ease;
        }
        /* 整个信息卡外框：悬停泛起大范围柔紫蓝光晕（区别于小格局部光） */
        .info-card:hover{
            border-color:rgba(178,196,246,.9);
            box-shadow:0 14px 46px rgba(50,100,180,.15), 0 0 36px rgba(150,168,242,.32), 0 0 22px rgba(140,180,255,.2);
        }
        .info-card h3{color:#1e3a5f;font-size:16px;margin-bottom:4px;padding-bottom:12px;border-bottom:1px solid rgba(50,100,180,.12);font-weight:600;}
        .info-card .row{
            position:relative;overflow:hidden;
            display:flex;align-items:center;
            padding:11px 14px;border-radius:12px;font-size:14px;line-height:1.5;
            background:rgba(255,255,255,.5);
            border:1px solid rgba(255,255,255,.75);
            transition:box-shadow .3s ease,border-color .3s ease,background .3s ease;
        }
        .info-card .k{width:92px;color:#6088b8;flex-shrink:0;font-weight:400;}
        .info-card .v{flex:1;color:#1e3a5f;word-break:break-all;font-weight:500;}
        .footer{text-align:center;color:#7098c8;font-size:11px;margin-top:18px;line-height:1.7;transition:opacity .3s;}

        /* ===== 全屏背景遮罩 ===== */
        .fs-bg{
            position:fixed;inset:0;z-index:8999;pointer-events:none;
            background:
                radial-gradient(1200px 800px at 70% -10%, rgba(150,190,255,.35), transparent 60%),
                radial-gradient(1000px 700px at 10% 110%, rgba(180,160,255,.28), transparent 60%),
                linear-gradient(160deg,#eef3f9 0%,#e4edf7 50%,#e9e6f6 100%);
            opacity:0;transition:opacity .45s ease;
        }
        /* ===== 全屏控制按钮层 ===== */
        .fs-ctrl-layer{position:fixed;inset:0;z-index:9100;pointer-events:none;}
        .fs-ctrl{
            position:absolute;width:46px;height:46px;border-radius:50%;
            background:rgba(255,255,255,.82);backdrop-filter:blur(24px) saturate(180%);
            -webkit-backdrop-filter:blur(24px) saturate(180%);
            border:1px solid rgba(255,255,255,.9);
            box-shadow:0 8px 24px rgba(50,100,180,.22), 0 0 0 1px rgba(150,190,255,.2);
            display:flex;align-items:center;justify-content:center;
            cursor:pointer;color:#2563a8;pointer-events:auto;
            opacity:0;transform:scale(.5);
            transition:opacity .3s ease, transform .4s cubic-bezier(.34,1.56,.64,1), background .25s ease, color .25s ease;
        }
        .fs-ctrl.show{opacity:1;transform:scale(1);}
        .fs-ctrl:active{transform:scale(.85);}
        .fs-exit{top:calc(16px + env(safe-area-inset-top));right:16px;}
        .fs-rotate{bottom:calc(20px + env(safe-area-inset-bottom));right:16px;}
        .fs-eye{bottom:calc(20px + env(safe-area-inset-bottom));right:74px;}
        .fs-ctrl.active{background:#2563a8;color:#fff;}

        /* ===== 整页全屏：flex 布局，模型自适应占满 ===== */
        .full-wrap.fs-page{
            display:flex;flex-direction:column;gap:8px;padding:8px;
        }
        .full-wrap.fs-page .model-container{
            flex:1 1 auto;height:auto!important;min-height:0;border-radius:20px;
            box-shadow:0 20px 60px rgba(50,100,180,.22), 0 0 40px rgba(140,180,255,.3);
        }
        .full-wrap.fs-page .info-card{
            flex:0 0 auto;margin-top:0;
            max-height:60vh;overflow:hidden;
            padding:8px 11px 10px;border-radius:18px;
            display:grid;grid-template-columns:1fr 1fr;gap:5px 9px;
            transition:opacity .4s ease, max-height .48s cubic-bezier(.22,1,.36,1),
                     padding .48s cubic-bezier(.22,1,.36,1),
                     border-width .48s ease, margin .48s ease;
            animation:fsCardIn .56s cubic-bezier(.22,1,.36,1) .12s backwards;
        }
        .full-wrap.fs-page .info-card h3{
            grid-column:1/-1;font-size:12px;margin-bottom:0;padding-bottom:4px;
        }
        /* 全屏两列小格：纵向排版（其余外观沿用通用小格） */
        .full-wrap.fs-page .info-card .row{
            flex-direction:column;align-items:flex-start;gap:1px;
            padding:4px 10px;border-radius:10px;line-height:1.25;
        }
        /* 悬停：只在小格边缘泛起一小圈雾蓝柔光（普通页与全屏通用） */
        .info-card .row:hover{
            border-color:rgba(158,188,228,.55);
            background:rgba(255,255,255,.66);
            box-shadow:0 0 10px rgba(145,178,230,.18),inset 0 0 8px rgba(190,210,240,.15);
        }
        .info-card .row .ripple{
            position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;pointer-events:none;
            background:radial-gradient(circle,rgba(255,255,255,.78) 0%,rgba(180,204,242,.32) 46%,transparent 70%);
            transform:translate(-50%,-50%) scale(0);
            animation:cellRipple .7s cubic-bezier(.22,1,.36,1) forwards;
        }
        /* 点击：外圈较大光晕，雾蓝带一点暖白，柔和不刺眼 */
        .info-card .row.lit{
            border-color:rgba(140,175,226,.7);background:rgba(255,255,255,.86);
            box-shadow:0 0 0 1px rgba(160,190,232,.38),0 0 20px 4px rgba(150,180,230,.26),inset 0 0 12px rgba(198,214,242,.26);
        }
        @keyframes cellRipple{
            0%{transform:translate(-50%,-50%) scale(0);opacity:.9;}
            100%{transform:translate(-50%,-50%) scale(22);opacity:0;}
        }
        .model-container.fs-tap{
            transition:box-shadow .32s ease;
            box-shadow:0 0 0 2px rgba(145,178,228,.38),0 0 42px rgba(150,180,230,.28)!important;
        }        .full-wrap.fs-page .model-container:hover{
            border-color:rgba(178,196,246,.9);
            box-shadow:0 22px 60px rgba(50,100,180,.2),0 0 48px rgba(150,168,242,.4);
        }
        @keyframes fsCardIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
        /* 退出全屏时信息卡先柔和淡出，避免两列小格被挤压变形 */
        .full-wrap.fs-exiting .info-card{opacity:0!important;}
        .full-wrap.fs-page .info-card .k{width:auto;font-size:9.5px;letter-spacing:.3px;}
        .full-wrap.fs-page .info-card .v{font-size:12px;font-weight:600;width:100%;line-height:1.3;}
        .full-wrap.fs-page.info-collapsed .info-card{
            max-height:0;opacity:0;padding-top:0;padding-bottom:0;
            margin-top:0;border-width:0;pointer-events:none;
        }
        /* 模型一键全屏：铺满无圆角 */
        .model-container.fs-model{border-radius:0;border-width:0;}
        .model-container.fs-model .toolbar{opacity:0;pointer-events:none;}
        .model-container.fs-model .tip-banner{opacity:0!important;pointer-events:none!important;}
        /* 模型一键全屏：信息做成一条条毛玻璃浮层标签（文字始终清晰），模型在标签间隙完整呈现，无生硬光斑 */
        .full-wrap.model-backdrop .info-card{
            position:relative;z-index:9003;opacity:1;filter:none;padding:0;background:transparent;border:none;box-shadow:none;
            display:flex;flex-direction:column;align-items:flex-start;gap:7px;pointer-events:none;
        }
        .full-wrap.model-backdrop .info-head{
            pointer-events:auto;width:auto;margin:0 0 2px;padding:8px 14px;
            background:rgba(243,249,255,.62);border:1px solid rgba(255,255,255,.7);border-radius:14px;
            backdrop-filter:blur(13px) saturate(165%);-webkit-backdrop-filter:blur(13px) saturate(165%);
            box-shadow:0 6px 18px rgba(60,110,190,.1);
        }
        .full-wrap.model-backdrop .info-head .info-tools{pointer-events:auto;}
        .full-wrap.model-backdrop .info-card .row{
            display:inline-flex;width:auto;align-items:center;gap:10px;padding:6px 14px;border-radius:12px;
            background:rgba(243,249,255,.7);border:1px solid rgba(255,255,255,.72);
            box-shadow:0 6px 16px rgba(60,110,190,.1);
            backdrop-filter:blur(13px) saturate(165%);-webkit-backdrop-filter:blur(13px) saturate(165%);
        }
        .full-wrap.model-backdrop .info-card .k{width:auto;min-width:62px;font-size:11.5px;}
        .full-wrap.model-backdrop .info-card .v{font-size:12.5px;}
        .full-wrap.model-backdrop .model-container{background:linear-gradient(160deg,rgba(233,243,252,.74),rgba(219,233,249,.62));}
        body.in-fs .header,body.in-fs .footer{opacity:0;pointer-events:none;}
        /* 全屏背景不透明，毛玻璃模糊无视觉作用且逐帧重算很贵，整段关闭以保证动画流畅 */
        body.in-fs .model-container,
        body.in-fs .info-card{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;}
        body.in-fs .model-container{background:rgba(223,237,251,.52);}
        body.in-fs .info-card{background:rgba(226,239,252,.6);}
        /* 进/出全屏过渡只走 transform，提升为合成层，避免重排重绘卡顿 */
        .full-wrap.fs-anim, .model-container.fs-anim{will-change:transform;}

        /* ===== 信息卡标题行工具按钮（复制 / 管理员） ===== */
        .info-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px;padding-bottom:12px;border-bottom:1px solid rgba(50,100,180,.12);}
        .info-head h3{margin:0;padding:0;border:none;}
        .info-tools{display:flex;gap:8px;}
        .icon-btn{width:32px;height:32px;border-radius:10px;border:1px solid rgba(255,255,255,.85);
            background:rgba(255,255,255,.55);color:#5b86c0;display:grid;place-items:center;cursor:pointer;
            box-shadow:0 4px 12px rgba(60,110,190,.10);
            transition:box-shadow .28s ease,border-color .28s ease,background .28s ease,transform .15s ease;}
        .icon-btn:hover{border-color:rgba(158,188,228,.7);background:rgba(255,255,255,.75);
            box-shadow:0 0 12px rgba(145,178,230,.28),inset 0 0 8px rgba(190,210,240,.18);}
        .icon-btn:active{transform:scale(.92);}

        /* ===== 管理员密码弹窗 ===== */
        .modal-mask{position:fixed;inset:0;z-index:9500;display:flex;align-items:center;justify-content:center;
            background:rgba(40,70,130,.28);backdrop-filter:blur(10px) saturate(160%);-webkit-backdrop-filter:blur(10px) saturate(160%);
            opacity:0;pointer-events:none;transition:opacity .32s ease;padding:24px;}
        .modal-mask.show{opacity:1;pointer-events:auto;}
        .modal-card{width:100%;max-width:340px;background:rgba(238,246,255,.92);border:1px solid rgba(255,255,255,.9);
            border-radius:22px;padding:24px 22px 20px;box-shadow:0 24px 70px rgba(40,80,150,.32);
            transform:translateY(18px) scale(.96);transition:transform .38s cubic-bezier(.22,1,.36,1);}
        .modal-mask.show .modal-card{transform:translateY(0) scale(1);}
        .modal-title{font-size:17px;font-weight:700;color:#1e3a5f;}
        .modal-sub{font-size:12.5px;color:#6f93c2;margin-top:5px;line-height:1.5;}
        .modal-input{width:100%;box-sizing:border-box;margin-top:16px;height:46px;border-radius:13px;border:1.5px solid rgba(120,160,225,.4);
            background:rgba(255,255,255,.85);padding:0 14px;font-size:16px;color:#1e3a5f;letter-spacing:2px;outline:none;

        /* ===== 编辑模式：字段可编辑 ===== */

        .admin-bar{position:fixed;left:50%;bottom:18px;transform:translate(-50%,140%);z-index:9520;
            display:flex;gap:8px;max-width:calc(100vw - 24px);padding:10px;border-radius:18px;
            background:rgba(238,246,255,.9);border:1px solid rgba(255,255,255,.9);

        .abtn{border:none;white-space:nowrap;height:40px;padding:0 15px;border-radius:11px;font-size:13.5px;font-weight:600;cursor:pointer;
            background:linear-gradient(135deg,#5b93e6,#4a7fd6);color:#fff;box-shadow:0 6px 14px rgba(80,130,220,.3);transition:transform .15s;}
        .abtn:active{transform:scale(.94);}
        .abtn.ghost{background:rgba(255,255,255,.8);color:#5b86c0;box-shadow:none;border:1px solid rgba(120,160,225,.3);}
        body.editing{padding-bottom:96px;}
        .admin-bar{flex-wrap:wrap;justify-content:center;}
        .admin-bar{flex-wrap:nowrap;gap:6px;padding:8px;}
        .admin-bar .abtn{height:38px;padding:0 12px;font-size:13px;}

        /* ===== 一键小窗（澎湃 OS 风格） ===== */
        .mini-backdrop{position:fixed;inset:0;z-index:9040;background:radial-gradient(circle at 50% 30%,rgba(120,160,230,.16),rgba(40,70,130,.26));
            opacity:0;pointer-events:none;transition:opacity .4s ease;}
        .mini-backdrop.show{opacity:1;}
        .full-wrap.mini{position:fixed;z-index:9050;overflow:hidden;border-radius:26px;touch-action:none;
            box-shadow:0 30px 90px rgba(25,60,120,.42),0 0 0 5px rgba(255,255,255,.55),0 0 60px rgba(120,160,235,.25);
            transition:transform .42s cubic-bezier(.3,.9,.32,1),border-radius .42s ease;}
        .full-wrap.mini.dragging{transition:none;}
        .full-wrap.mini .toolbar,.full-wrap.mini .tip-banner{opacity:0!important;pointer-events:none;}
        .full-wrap.mini .model-container{border-radius:0;border-width:0;}
        .mini-drag{position:absolute;inset:0;z-index:6;touch-action:none;cursor:grab;}
        .mini-chrome{position:absolute;top:10px;right:10px;z-index:7;display:flex;gap:7px;}
        .mini-chrome .mc-btn{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.85);
            background:rgba(255,255,255,.7);color:#4a7fd6;display:grid;place-items:center;cursor:pointer;
            box-shadow:0 6px 16px rgba(40,80,150,.25);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
        .mini-hint{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:9045;
            background:rgba(30,60,110,.78);color:#fff;font-size:13px;padding:9px 18px;border-radius:30px;
            opacity:0;pointer-events:none;transition:opacity .4s ease;white-space:nowrap;}
        .mini-hint.show{opacity:1;}
        body.in-mini .header,body.in-mini .footer{opacity:0;pointer-events:none;}
        /* 功能圆键点按：柔光玻璃光晕从触点漾开 */
        .glow-press{position:relative;overflow:hidden;isolation:isolate;}
        .glow-press>svg,.glow-press>span{position:relative;z-index:2;}
        .glow-press .gp-ripple{position:absolute;border-radius:50%;pointer-events:none;z-index:1;
            background:radial-gradient(circle,rgba(255,255,255,.95) 0%,rgba(170,200,245,.55) 42%,rgba(170,200,245,0) 72%);
            transform:translate(-50%,-50%) scale(0);animation:gpWave .6s cubic-bezier(.22,1,.36,1) forwards;}
        @keyframes gpWave{0%{opacity:.9;transform:translate(-50%,-50%) scale(0);}100%{opacity:0;transform:translate(-50%,-50%) scale(1);}}
        /* 小窗右下角自由缩放手柄 */
        .mini-resize{position:absolute;right:6px;bottom:6px;width:30px;height:30px;z-index:8;cursor:nwse-resize;touch-action:none;display:grid;place-items:center;color:rgba(74,127,214,.85);border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.75),rgba(220,234,250,.35));box-shadow:0 3px 10px rgba(60,110,190,.22);}
        .mini-resize::before{content:'';position:absolute;right:8px;bottom:8px;width:11px;height:11px;border-right:2.4px solid currentColor;border-bottom:2.4px solid currentColor;border-bottom-right-radius:3px;}
    </style>
</head>

                <button class="icon-btn" id="btnAdmin" title="管理员入口"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></button>

</div>

<script>
const $ = s => document.querySelector(s);
const id = new URLSearchParams(location.search).get('id');
const viewer = $('#viewer'), loading = $('#loading'), bar = $('#bar'), percent = $('#percent'),
error = $('#error'), fullWrap = $('#fullWrap'), btnFull = $('#btnFull'), btnModelFull = $('#btnModelFull'),
btnRotate = $('#btnRotate'), btnReset = $('#btnReset'), infoCard = $('#infoCard'), tipBanner = $('#tipBanner'),
glow = $('#glow'), btnSwitch = $('#btnSwitch'), toast = $('#toast'), modelContainer = $('#modelContainer');
let rotate = false, tipTimer = null, retryCount = 0;
const fields = ['partId','workNo','projectName','section','partType','material','spec','quantity'];
/* 管理员在本机保存的修改：渲染前合并到数据（仅保存在本设备浏览器，导出 data.js 才能同步到线上） */
const OV_KEY = 'gangjiegou_overrides_v1';
function loadOverrides(){
    try{
        const ov = JSON.parse(localStorage.getItem(OV_KEY) || '{}');
        Object.keys(ov).forEach(k => { if(window.partData && partData[k]) Object.assign(partData[k], ov[k]); });
    }catch(e){}
}
loadOverrides();
if(id && window.partData && partData[id]){
    const d = partData[id];
    fields.forEach(f => {const el = $(`#${f}`); if(el && d[f]) el.innerText = d[f];});
    viewer.src = d.glbUrl;
    viewer.autoRotateSpeed = 5;
    viewer.addEventListener('progress', e => {
        if(e.total){
            const p = Math.round(e.loaded/e.total*100);
            bar.style.width = p + '%'; percent.innerText = p + '%';
            const sub = $('#loadingSub');
            if(p < 30) sub.innerText = '正在下载模型数据…';
            else if(p < 70) sub.innerText = '正在传输模型文件…';
            else if(p < 95) sub.innerText = '正在解析模型…';
            else sub.innerText = '即将完成…';
        }
    });
    viewer.addEventListener('load', () => {
        bar.style.width = '100%'; percent.innerText = '100%';
        $('#loadingSub').innerText = '加载完成';
        setTimeout(()=>{
            loading.style.opacity = '0';
            setTimeout(()=>{ loading.style.display = 'none'; }, 450);
            document.querySelector('.progress').classList.add('done');
            tipBanner.classList.add('show');
            tipTimer = setTimeout(()=>tipBanner.classList.remove('show'), 5000);
        }, 300);
    });
    viewer.addEventListener('error', () => {
        if(retryCount < 1){retryCount++; setTimeout(()=>{viewer.src = partData[id].glbUrl;}, 1000);}
        else {loading.style.display='none'; error.style.display='flex';}
    });
}else{
    document.querySelector('.header h2').innerText = '构件信息未找到';
    modelContainer.style.display = 'none'; loading.style.display = 'none';
}
let glowRAF = null;
function moveGlow(x,y){
    if(glowRAF) return;
    glowRAF = requestAnimationFrame(()=>{
        glow.style.transform = 'translate(' + x + 'px,' + y + 'px) translate(-50%,-50%)';
        glow.style.opacity = '1'; glowRAF = null;
    });
}
document.addEventListener('pointermove', e => moveGlow(e.clientX, e.clientY), {passive:true});
document.addEventListener('pointerdown', e => moveGlow(e.clientX, e.clientY), {passive:true});
document.addEventListener('mouseleave', () => glow.style.opacity = '0');
btnRotate.onclick = () => { rotate = !rotate; viewer.autoRotate = rotate; btnRotate.classList.toggle('active', rotate); }
btnReset.onclick = () => { viewer.cameraOrbit = "0deg 75deg auto"; viewer.cameraTarget = "0m 0m 0m"; }
let clickCount = 0, clickTimer = null;
viewer.addEventListener('click', (e) => {
    clickCount++; clearTimeout(clickTimer);
    clickTimer = setTimeout(() => {
        if(clickCount === 3){
            const p = e.intersectionPoint;
            if(p){ viewer.cameraTarget = `${p.x}m ${p.y}m ${p.z}m`; showToast("已定位到该点"); }
        }
        clickCount = 0;
    }, 350);
});
function showToast(msg, duration = 1800){
    toast.innerText = msg; toast.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(()=>toast.classList.remove('show'), duration);
}
const modelList = $('#modelList'), modelMask = $('#modelMask'), modelItems = $('#modelItems');
btnSwitch.onclick = () => {
    modelItems.innerHTML = '';
    Object.keys(partData).forEach((pid, idx) => {
        const d = partData[pid];
        const item = document.createElement('div');
        item.className = 'model-item';
        item.style.transitionDelay = (idx * 60) + 'ms';
        item.innerHTML = `<div class="mid">构件编号：${d.partId || pid}</div><div class="mname">${d.projectName || ''} · ${d.partType || ''}</div>`;
        item.onclick = () => { modelMask.click(); setTimeout(()=>{ location.href = location.pathname + "?id=" + pid; }, 300); };
        modelItems.appendChild(item);
    });
    modelList.classList.add('show'); modelMask.classList.add('show');
};
modelMask.onclick = () => { modelList.classList.remove('show'); modelMask.classList.remove('show'); };
tipBanner.onclick = () => { tipBanner.classList.remove('show'); clearTimeout(tipTimer); };

/* ============ FLIP 平滑全屏（纯CSS，不移动DOM，修复层叠上下文） ============ */
const EASE = 'cubic-bezier(.22,1,.36,1)';
const EASE_IN = 'cubic-bezier(.3,.9,.32,1)';
const FS_MS = 480;
const FS_IN_MS = 560;
const EASE_OUT = 'cubic-bezier(.33,0,.2,1)';
const FS_OUT_MS = 540;
const FLY_MS = 380;
const EASE_FLY = 'cubic-bezier(.4,0,.72,.45)';
let fsState = null;
let fsPushed = false;   // 是否已为全屏压入历史（让手机返回键先退出全屏，而不是关闭网页）

const ICON_EXIT = '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>';
const ICON_ROTATE = '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9.6" y="3" width="10.8" height="15.6" rx="2.7" opacity="0.4"/><rect x="3.6" y="5.2" width="10.8" height="15.6" rx="2.7"/></svg>';
const ICON_EYE = '<svg class="ic-eye" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
const ICON_EYE_OFF = '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
const ICON_EXPAND = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>';

function enterFullscreen(type){
    if(fsState) return;
    const el = type === 'model' ? modelContainer : fullWrap;
    const rect = el.getBoundingClientRect();
    const srcRect = type === 'page' ? modelContainer.getBoundingClientRect() : rect;
    const vw = window.innerWidth, vh = window.innerHeight;
    const saved = {
        position: el.style.position, left: el.style.left, top: el.style.top,
        width: el.style.width, height: el.style.height, zIndex: el.style.zIndex,
        borderRadius: el.style.borderRadius, transition: el.style.transition,
        transform: el.style.transform, transformOrigin: el.style.transformOrigin,
        willChange: el.style.willChange, wrapZ: fullWrap.style.zIndex
    };

    fullWrap.style.zIndex = '9001';

    const bg = document.createElement('div');
    bg.className = 'fs-bg'; document.body.appendChild(bg);
    const ctrl = document.createElement('div');
    ctrl.className = 'fs-ctrl-layer'; document.body.appendChild(ctrl);
    function makeBtn(cls, html, onclick){
        const b = document.createElement('div');
        b.className = 'fs-ctrl ' + cls;
        b.innerHTML = html; b.onclick = onclick;
        ctrl.appendChild(b); return b;
    }
    makeBtn('fs-exit', ICON_EXIT, requestExitFullscreen);
    if(type === 'model'){
        makeBtn('fs-rotate', ICON_ROTATE, toggleLandscape);
        modelContainer.classList.add('fs-model');
        fullWrap.classList.add('model-backdrop');
    }
    if(type === 'page'){
        const eye = makeBtn('fs-eye', ICON_EYE, function(){
            const collapsed = fullWrap.classList.toggle('info-collapsed');
            this.classList.toggle('active', collapsed);
            this.innerHTML = collapsed ? ICON_EYE_OFF : ICON_EYE;
            setTimeout(safeResize, 500);
        });
        fullWrap.classList.add('fs-page');
    }

    document.body.classList.add('in-fs');
    fullWrap.classList.remove('fs-exiting');

    /* 最终布局一次性到位：fixed 铺满，画布只 resize 这一次 */
    el.style.position = 'fixed';
    el.style.left = '0px'; el.style.top = '0px';
    el.style.width = '100vw'; el.style.height = '100vh';
    el.style.zIndex = '9002';
    el.style.transformOrigin = '0 0';
    el.style.willChange = 'transform';
    if(type === 'model') el.style.borderRadius = '26px';

    /* Invert：用 transform 把全屏态视觉拉回起点（不触发任何重排） */
    const sx = srcRect.width / vw, sy = srcRect.height / vh;
    el.style.transform = 'translate(' + srcRect.left + 'px,' + srcRect.top + 'px) scale(' + sx + ',' + sy + ')';

    fsState = { el, type, saved, rect, srcRect, bg, ctrl, isLandscape:false };
    try{ history.pushState({fs:type}, '', '#' + (type==='model'?'model-full':'page-full')); fsPushed = true; }catch(e){}
    void el.offsetHeight;
    safeResize();

    /* 双 rAF：先让“缩小的起点”真实绘制一帧，再开始放大，避免一闪即全屏 */
    requestAnimationFrame(() => requestAnimationFrame(() => {
        el.style.transition = 'transform ' + FS_IN_MS + 'ms ' + EASE_IN + ', border-radius ' + FS_IN_MS + 'ms ' + EASE_IN;
        el.style.transform = 'translate(0px,0px) scale(1,1)';
        if(type === 'model') el.style.borderRadius = '0px';
        bg.style.opacity = '1';
    }));
    setTimeout(()=>{ ctrl.querySelectorAll('.fs-ctrl').forEach(b=>b.classList.add('show')); }, 140);
    setTimeout(()=>{ el.style.transform = 'none'; safeResize(); }, FS_IN_MS + 60);
}
function safeResize(){ try{ if(typeof viewer.resize === 'function') viewer.resize(); else window.dispatchEvent(new Event('fs-nudge')); }catch(e){} }

function requestExitFullscreen(){
    if(!fsState) return;
    if(fsPushed){ try{ history.back(); }catch(e){ exitFullscreen(); } }
    else { exitFullscreen(); }
}
/* 手机物理/手势返回键：若正在全屏，先退出全屏回到网页主页，不关闭页面 */
window.addEventListener('popstate', () => {
    if(fsState){ fsPushed = false; exitFullscreen(); }
});
function exitFullscreen(){
    if(!fsState) return;
    const state = fsState;
    const { el, type, saved, bg, ctrl } = state;
    if(state.isLandscape){ resetLandscape(true); }

    ctrl.querySelectorAll('.fs-ctrl').forEach(b=>b.classList.remove('show'));
    bg.style.opacity = '0';

    /* 飞退消散：全屏层只轻微后退、下移并淡出（中心锚点），不再缩回小矩形，杜绝挤压/弹动 */
    el.style.transition = 'transform ' + FLY_MS + 'ms ' + EASE_FLY + ', opacity ' + (FLY_MS-60) + 'ms ease-in, border-radius ' + FLY_MS + 'ms ' + EASE_FLY;
    el.style.transformOrigin = 'center center';
    requestAnimationFrame(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(26px) scale(.9)';
        if(type === 'model') el.style.borderRadius = '26px';
    });

    setTimeout(()=>{
        /* 此刻全屏层已不可见，一次性恢复普通布局，避免逐帧重排 */
        el.style.transition = 'none';
        el.style.opacity = '0';
        el.style.transform = 'translateY(14px) scale(.985)';
        el.style.transformOrigin = saved.transformOrigin;
        el.style.position = saved.position;
        el.style.left = saved.left; el.style.top = saved.top;
        el.style.width = saved.width; el.style.height = saved.height;
        el.style.zIndex = saved.zIndex;
        el.style.borderRadius = saved.borderRadius;
        el.style.willChange = saved.willChange;
        fullWrap.style.zIndex = saved.wrapZ;
        fullWrap.classList.remove('fs-page','info-collapsed');
        fullWrap.classList.remove('model-backdrop');
        modelContainer.classList.remove('fs-model');
        document.body.classList.remove('in-fs');
        bg.remove(); ctrl.remove();
        fsState = null;
        safeResize();
        void el.offsetHeight;
        /* 普通层柔和升起、淡入回位 */
        requestAnimationFrame(()=>requestAnimationFrame(()=>{
            el.style.transition = 'opacity 440ms ease, transform 480ms ' + EASE_IN;
            el.style.opacity = '1';
            el.style.transform = '';
            setTimeout(()=>{ el.style.transition = saved.transition; el.style.opacity=''; el.style.transform = saved.transform; }, 540);
        }));
    }, FLY_MS + 30);
}

function applyTransition(el, props){
    el.style.transition = props.map(p => p + ' .45s ' + EASE).join(',');
}
function toggleLandscape(){
    if(!fsState || fsState.type !== 'model') return;
    fsState.isLandscape = !fsState.isLandscape;
    const el = fsState.el;
    /* 只动 transform（旋转+缩放），盒子始终 100vw×100vh，画布不重排、不重设，纯 GPU 合成不卡 */
    el.style.transition = 'transform .52s ' + EASE_IN;
    el.style.transformOrigin = 'center center';
    if(fsState.isLandscape){
        const k = window.innerHeight / window.innerWidth;
        el.style.transform = 'rotate(90deg) scale(' + k + ')';
        showToast('横屏模式');
    }else{
        el.style.transform = 'none';
        showToast('竖屏模式');
    }
}
function resetLandscape(immediate){
    if(!fsState) return;
    fsState.isLandscape = false;
    const el = fsState.el;
    el.style.transformOrigin = 'center center';
    if(immediate){
        el.style.transition = 'none';
        el.style.transform = 'none';
        void el.offsetHeight;
        el.style.transition = '';
    }else{
        el.style.transition = 'transform .52s ' + EASE_IN;
        el.style.transform = 'none';
    }
}

/* 点按信息小格：触点涟漪扩散 + 该格外圈泛起光晕（仅整页全屏呈现） */
document.querySelectorAll('.info-card .row').forEach(row => {

/* 整页全屏时点按模型卡片，边缘轻亮一下作为触达反馈 */
let modelTapTimer = null;
modelContainer.addEventListener('pointerdown', () => {

btnModelFull.onclick = () => enterFullscreen('model');
btnFull.onclick = () => fsState ? requestExitFullscreen() : enterFullscreen('page');
document.addEventListener('keydown', e => { if(e.key === 'Escape' && fsState) requestExitFullscreen(); });
window.addEventListener('resize', () => { if(fsState) safeResize(); });
if(location.hash && /full/.test(location.hash)){ try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} }
/* ===================== 一键复制构件信息 ===================== */
function copyText(t){
    return new Promise(res => {
        let ok=false;
        try{
            const ta=document.createElement('textarea');
            ta.value=t; ta.setAttribute('readonly','');
            ta.style.cssText='position:fixed;top:6px;left:6px;width:1px;height:1px;padding:0;border:0;opacity:0;';
            document.body.appendChild(ta); ta.focus();
            ta.select(); ta.setSelectionRange(0,t.length);
            try{ ok=document.execCommand('copy'); }catch(e){}
            ta.remove();
        }catch(e){}
        if(ok) return res(true);
        if(navigator.clipboard && navigator.clipboard.writeText){
            navigator.clipboard.writeText(t).then(()=>res(true)).catch(()=>res(false));
        } else res(false);
    });
}
$('#btnCopy').onclick = async () => {
    if(!id || !partData[id]){ showToast('暂无可复制的信息'); return; }
    const d = partData[id];
    const labels = {partId:'构件编号',workNo:'加工号',projectName:'项目名称',section:'分部工程',partType:'构件类型',material:'材质',spec:'规格',quantity:'数量'};
    let txt = fields.map(f => labels[f] + '：' + (d[f] || '')).join('\n') + '\n昆明长水国际机场项目 · 钢结构构件一物一码';
    const ok = await copyText(txt);
    showToast(ok ? '构件信息已复制，可粘贴发送' : '复制失败，请长按选择文字');
};

/* ===================== 管理员入口 / 在线编辑 ===================== */
const editFields = ['workNo','projectName','section','partType','material','spec','quantity'];
const ADMIN_PWD = 'zwj0503';
const adminMask=$('#adminMask'), adminCard=$('#adminCard'), adminPwd=$('#adminPwd'), adminErr=$('#adminErr'), adminBar=$('#adminBar');
let adminOn = false;
function openAdmin(){
    adminMask.classList.add('show'); adminErr.classList.remove('show');
    adminCard.classList.remove('shake'); adminPwd.value='';
    setTimeout(()=>adminPwd.focus(),140);
}
function closeAdmin(){ adminMask.classList.remove('show'); adminPwd.value=''; }
$('#btnAdmin').onclick = openAdmin;
$('#adminCancel').onclick = closeAdmin;
adminMask.addEventListener('click', e => { if(e.target===adminMask) closeAdmin(); });
function submitPwd(){
    if(adminPwd.value === ADMIN_PWD){ closeAdmin(); enterEdit(); }
    else{
        adminErr.classList.add('show');
        adminCard.classList.remove('shake'); void adminCard.offsetWidth; adminCard.classList.add('shake');
        adminPwd.select();
    }
}
$('#adminOk').onclick = submitPwd;
adminPwd.addEventListener('keydown', e => { if(e.key==='Enter') submitPwd(); if(e.key==='Escape') closeAdmin(); });

function enterEdit(){
    adminOn = true;
    document.body.classList.add('editing'); infoCard.classList.add('editing');
    editFields.forEach(f => { const el=$('#'+f); if(el) el.setAttribute('contenteditable','true'); });
    const pidEl=$('#partId'); if(pidEl && pidEl.parentElement) pidEl.parentElement.setAttribute('data-lock','1');
    adminBar.classList.add('show');
    showToast('已进入编辑模式，改完点“保存修改”');
}
function exitEdit(){
    adminOn = false;
    document.body.classList.remove('editing'); infoCard.classList.remove('editing');
    editFields.forEach(f => { const el=$('#'+f); if(el) el.removeAttribute('contenteditable'); });
    adminBar.classList.remove('show');
}
function collectEdits(){
    const rec={};
    editFields.forEach(f => { const el=$('#'+f); if(el) rec[f]=el.innerText.trim(); });
    return rec;
}
$('#adminSave').onclick = () => {
    if(!id || !partData[id]){ showToast('当前构件不可编辑'); return; }
    const rec = collectEdits();
    Object.assign(partData[id], rec);
    let ov={}; try{ ov=JSON.parse(localStorage.getItem(OV_KEY)||'{}'); }catch(e){}
    ov[id] = Object.assign({}, ov[id], rec);
    localStorage.setItem(OV_KEY, JSON.stringify(ov));
    showToast('已保存到本机，导出后可同步线上');
};
$('#adminDone').onclick = exitEdit;
$('#adminClear').onclick = () => {
    try{ const ov=JSON.parse(localStorage.getItem(OV_KEY)||'{}');
        if(ov[id]){ delete ov[id]; localStorage.setItem(OV_KEY, JSON.stringify(ov)); }
    }catch(e){}
    location.reload();
};
$('#adminExport').onclick = () => {
    let txt = '// 构件数据总对象，网页读取所有构件信息\r\n';
    txt += '// 由管理员在页面“导出 data.js”生成：用本文件替换仓库中的 data.js，再用 GitHub Desktop 提交推送即可同步线上\r\n';
    txt += 'window.partData = ' + JSON.stringify(window.partData, null, 4) + ';\r\n';
    const blob = new Blob([txt], {type:'text/javascript;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'data.js';

    setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
    showToast('已导出 data.js，请替换仓库文件并提交', 2600);
};

/* ===================== 一键小窗（澎湃 OS 风格缩放/拖动） ===================== */
const miniBackdrop=$('#miniBackdrop'), miniHint=$('#miniHint');
let miniState=null;
$('#btnMini').onclick = () => { if(!fsState && !miniState) enterMini(); };
function enterMini(){
    const wrap=fullWrap, rect=wrap.getBoundingClientRect();
    let sW=Math.min(280, window.innerWidth*0.8);
    let s=sW/rect.width, sH=rect.height*s, maxH=window.innerHeight*0.78;
    if(sH>maxH){ s=maxH/rect.height; sH=rect.height*s; sW=rect.width*s; }
    const margin=14;
    const tx=window.innerWidth-rect.width*s-margin-rect.left;
    const ty=window.innerHeight-rect.height*s-margin-rect.top;
    const chrome=document.createElement('div'); chrome.className='mini-chrome';
    chrome.innerHTML='<button class="mc-btn" id="miniExpand" title="恢复">'+ICON_EXPAND+'</button>';
    const drag=document.createElement('div'); drag.className='mini-drag';
    const rsz=document.createElement('div'); rsz.className='mini-resize'; rsz.title='拖动缩放';
    wrap.appendChild(chrome); wrap.appendChild(drag); wrap.appendChild(rsz);
    bindGlowPress(chrome.querySelector('#miniExpand'));
    miniBackdrop.classList.add('show'); document.body.classList.add('in-mini');
    const sMin=Math.min(0.26, 170/rect.width);
    const sGo=Math.min(1.02, window.innerWidth*0.9/rect.width);
    miniState={rect,s,tx,ty,drag,rsz,chrome,wrap,ptrs:new Map(),mode:'none',sMin,sGo,moved:false,
        saved:{position:wrap.style.position,left:wrap.style.left,top:wrap.style.top,width:wrap.style.width,height:wrap.style.height,
               z:wrap.style.zIndex,transition:wrap.style.transition,transform:wrap.style.transform,origin:wrap.style.transformOrigin,radius:wrap.style.borderRadius}};
    wrap.style.transition='none';
    wrap.style.position='fixed'; wrap.style.left=rect.left+'px'; wrap.style.top=rect.top+'px';
    wrap.style.width=rect.width+'px'; wrap.style.height=rect.height+'px'; wrap.style.zIndex='9050';
    wrap.style.transformOrigin='0 0'; wrap.style.transform='translate(0,0) scale(1)';
    void wrap.offsetHeight;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
        wrap.classList.add('mini');
        applyMini();
    }));
    miniHint.classList.add('show'); clearTimeout(miniHint._t);
    miniHint._t=setTimeout(()=>miniHint.classList.remove('show'),2400);
    chrome.querySelector('#miniExpand').onclick=(e)=>{ e.stopPropagation(); exitMini(); };
    setupMiniControls(wrap);
}
function miniSize(){ const r=miniState.rect; return {w:r.width*miniState.s, h:r.height*miniState.s}; }
function clampPos(tx,ty,w,h){
    let nx = w>=window.innerWidth ? (window.innerWidth-w)/2 : Math.max(8,Math.min(window.innerWidth-w-8,tx));
    let ny = h>=window.innerHeight ? (window.innerHeight-h)/2 : Math.max(8,Math.min(window.innerHeight-h-8,ty));
    return {nx,ny};
}
function clampScale(v){ return Math.max(miniState.sMin, Math.min(miniState.sGo, v)); }
function applyMini(anim){
    const {wrap,tx,ty,s}=miniState;
    if(!anim){ wrap.style.transition='none'; }
    wrap.style.transform='translate('+tx+'px,'+ty+'px) scale('+s+')';
}
function exitMini(){
    if(!miniState) return;
    const {wrap,drag,rsz,chrome,saved}=miniState;
    wrap.classList.remove('dragging');
    wrap.style.transition='transform .42s cubic-bezier(.3,.9,.32,1),border-radius .42s ease';
    wrap.style.transform='translate(0,0) scale(1)';
    miniBackdrop.classList.remove('show'); miniHint.classList.remove('show');
    document.body.classList.remove('in-mini');
    setTimeout(()=>{
        wrap.classList.remove('mini');
        wrap.style.position=saved.position;wrap.style.left=saved.left;wrap.style.top=saved.top;
        wrap.style.width=saved.width;wrap.style.height=saved.height;wrap.style.zIndex=saved.z;
        wrap.style.transition=saved.transition;wrap.style.transform=saved.transform;
        wrap.style.transformOrigin=saved.origin;wrap.style.borderRadius=saved.radius;
        drag.remove(); rsz.remove(); chrome.remove(); miniState=null; safeResize();
    },440);
}
function setupMiniControls(wrap){
    let sx=0,sy=0,ox=0,oy=0,s0=0,pinchD=0,focal={x:0,y:0};
    const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
    const onMove=e=>{
        const st=miniState; if(!st) return;
        st.ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
        if(st.mode==='pinch' && st.ptrs.size>=2){
            const ps=[...st.ptrs.values()];
            const d=dist(ps[0],ps[1]);
            st.s=clampScale(s0*d/pinchD);
            const {w,h}=miniSize(); const p=clampPos(focal.x-w/2,focal.y-h/2,w,h);
            st.tx=p.nx; st.ty=p.ny; applyMini(false);
        }else if(st.mode==='resize'){
            st.s=clampScale(s0+(e.clientX-sx)/st.rect.width+(e.clientY-sy)/st.rect.height);
            const {w,h}=miniSize(); const p=clampPos(ox,oy,w,h); st.tx=p.nx; st.ty=p.ny;
            applyMini(false);
        }else if(st.mode==='move'){
            const dx=e.clientX-sx, dy=e.clientY-sy;
            if(Math.abs(dx)+Math.abs(dy)>6) st.moved=true;
            const {w,h}=miniSize(); const p=clampPos(ox+dx,oy+dy,w,h);
            st.tx=p.nx; st.ty=p.ny; applyMini(false);
        }
    };
    const onUp=e=>{
        const st=miniState; if(!st) return;
        const wasMode=st.mode;
        st.ptrs.delete(e.pointerId);
        if(wasMode==='pinch' && st.ptrs.size===1){
            const p=[...st.ptrs.values()][0];
            st.mode='move'; st.moved=true; sx=p.x; sy=p.y; ox=st.tx; oy=st.ty; s0=st.s;
            return;
        }
        if(st.ptrs.size>=1){ return; }
        window.removeEventListener('pointermove',onMove); window.removeEventListener('pointerup',onUp); window.removeEventListener('pointercancel',onUp);
        wrap.classList.remove('dragging');
        if(wasMode==='pinch'||wasMode==='resize'){
            st.mode='none';
            if(st.s>=st.sGo){ exitMini(); return; }  // 拖到接近全屏 -> 放大成全屏
        }else if(wasMode==='move'){
            if(!st.moved){ exitMini(); return; }    // 点按=恢复
            const {w}=miniSize(); const center=st.tx+w/2;
            st.tx=center<window.innerWidth/2?14:(window.innerWidth-w-14);
            wrap.style.transition='transform .3s cubic-bezier(.22,1,.36,1)'; applyMini(true);
            st.mode='none'; return;
        }
        st.mode='none';
    };
    const begin=(mode,e)=>{
        const st=miniState; if(!st) return;
        if(st.mode==='none') st.ptrs.clear();
        st.ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
        if(st.ptrs.size===2){ // 第二指按下 -> 双指捏合
            st.mode='pinch'; const ps=[...st.ptrs.values()];
            pinchD=Math.max(20,dist(ps[0],ps[1])); s0=st.s;
            focal={x:(ps[0].x+ps[1].x)/2,y:(ps[0].y+ps[1].y)/2};
        }else{
            st.mode=mode; st.moved=false;
            sx=e.clientX; sy=e.clientY; ox=st.tx; oy=st.ty; s0=st.s;
            wrap.classList.add('dragging');
        }
        window.addEventListener('pointermove',onMove);
        window.addEventListener('pointerup',onUp);
        window.addEventListener('pointercancel',onUp);
        e.preventDefault();
    };
    miniState.drag.addEventListener('pointerdown',e=>begin('move',e));
    miniState.rsz.addEventListener('pointerdown',e=>{e.stopPropagation();begin('resize',e);});
}

/* 功能按钮点按柔光光晕（静态按钮 + 动态生成按钮均可用） */
function bindGlowPress(el){
    if(!el || el.__glowBound) return; el.__glowBound=true;
    el.classList.add('glow-press');
    el.addEventListener('pointerdown',function(e){
        const r=el.getBoundingClientRect();
        const x=(e.clientX||r.left+r.width/2)-r.left, y=(e.clientY||r.top+r.height/2)-r.top;
        const d=Math.max(r.width,r.height)*2.6;
        const sp=document.createElement('span'); sp.className='gp-ripple';
        sp.style.left=x+'px'; sp.style.top=y+'px'; sp.style.width=d+'px'; sp.style.height=d+'px';
        el.appendChild(sp); setTimeout(()=>sp.remove(),640);
    });
}
document.querySelectorAll('.toolbar .btn,.icon-btn,.mbtn,.abtn').forEach(bindGlowPress);
</script>
