<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>中铁装配 钢结构构件信息</title>
    <!-- 预连接CDN，加快加载 -->
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft Yahei",sans-serif;}
        body {
            background:linear-gradient(135deg,#e0e7ff 0%,#f0f9ff 50%,#fef3f2 100%);
            padding:12px;max-width:100%;margin:0 auto;min-height:100vh;
        }
        /* 毛玻璃头部 */
        .header {
            background:rgba(255,255,255,0.65);
            backdrop-filter:blur(12px);
            -webkit-backdrop-filter:blur(12px);
            color:#00529B;padding:16px;border-radius:16px;text-align:center;margin-bottom:12px;
            box-shadow:0 4px 20px rgba(0,82,155,0.1);
            border:1px solid rgba(255,255,255,0.8);
        }
        .header h2 {font-size:18px;font-weight:600;letter-spacing:1px;}
        .header p {font-size:12px;opacity:0.7;margin-top:4px;letter-spacing:2px;}

        .full-wrap {position:relative;width:100%;}
        .model-container {
            position:relative;width:100%;height:400px;
            background:rgba(255,255,255,0.5);
            backdrop-filter:blur(8px);
            border-radius:16px;overflow:hidden;
            box-shadow:0 8px 32px rgba(0,82,155,0.12);
            border:1px solid rgba(255,255,255,0.8);
            transition:height 0.3s ease;
        }
        model-viewer {width:100%;height:100%;--poster-color:#f0f4f8;}

        /* 毛玻璃工具栏 */
        .viewer-toolbar{
            position:absolute;top:10px;right:10px;z-index:20;
            display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;
        }
        .tool-btn{
            background:rgba(255,255,255,0.35);
            backdrop-filter:blur(10px);
            -webkit-backdrop-filter:blur(10px);
            color:#003d73;border:1px solid rgba(255,255,255,0.5);
            border-radius:20px;padding:7px 12px;font-size:12px;cursor:pointer;
            box-shadow:0 2px 8px rgba(0,0,0,0.08);
            transition:all 0.2s;
        }
        .tool-btn:hover{background:rgba(255,255,255,0.6);transform:scale(1.03);}
        .tool-btn.active{background:#00529B;color:#fff;}

        /* 全屏模式 */
        .full-wrap:fullscreen{
            background:linear-gradient(135deg,#1e293b 0%,#0f172a 100%);
            padding:12px;
            display:flex;
            flex-direction:column;
        }
        .full-wrap:fullscreen .model-container{
            flex:1;
            height:auto;
            background:rgba(255,255,255,0.08);
            border-radius:12px;
            border:1px solid rgba(255,255,255,0.15);
        }
        .full-wrap:fullscreen .info-card{
            max-width:480px;
            margin:10px auto 0;
            background:rgba(255,255,255,0.9);
        }
        /* 横屏布局 */
        @media screen and (orientation: landscape){
            .full-wrap:fullscreen{
                flex-direction:row;
                gap:12px;
            }
            .full-wrap:fullscreen .model-container{
                flex:1;
            }
            .full-wrap:fullscreen .info-card{
                max-width:340px;
                margin:0;
                flex-shrink:0;
                overflow-y:auto;
            }
        }
        /* 全屏隐藏信息时，模型占满全部 */
        .full-wrap:fullscreen.panel-hidden .model-container{
            flex:1;
        }
        .full-wrap:fullscreen.panel-hidden .info-card{
            display:none;
        }

        /* 提示文字 */
        .full-tip{
            position:absolute;left:50%;transform:translateX(-50%);
            top:48px;z-index:21;
            color:#003d73;font-size:12px;
            background:rgba(255,255,255,0.7);
            backdrop-filter:blur(8px);
            padding:6px 14px;border-radius:20px;
            white-space:nowrap;box-shadow:0 2px 12px rgba(0,0,0,0.1);
            transition:opacity 0.4s;
        }

        /* 加载遮罩 */
        .loading-mask {
            position:absolute;top:0;left:0;width:100%;height:100%;
            background:rgba(240,244,248,0.9);
            backdrop-filter:blur(8px);
            display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;
        }
        .loading-text {font-size:14px;color:#64748b;margin-top:16px;}
        .loading-progress {width:60%;height:4px;background:#e2e8f0;border-radius:2px;margin-top:12px;overflow:hidden;}
        .progress-bar {height:100%;width:0%;background:linear-gradient(90deg,#3b82f6,#00529B);transition:width 0.3s;}
        .spinner {
            width:40px;height:40px;
            border:3px solid #e2e8f0;border-top:3px solid #00529B;
            border-radius:50%;animation:spin 1s linear infinite;
        }
        @keyframes spin {0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
        .error-tip {
            display:none;position:absolute;top:0;left:0;width:100%;height:100%;
            background:#fff;flex-direction:column;align-items:center;justify-content:center;z-index:10;
            color:#64748b;font-size:14px;
        }

        /* 毛玻璃信息卡片 */
        .info-card {
            background:rgba(255,255,255,0.75);
            backdrop-filter:blur(12px);
            -webkit-backdrop-filter:blur(12px);
            padding:18px;border-radius:16px;margin-top:12px;
            box-shadow:0 4px 24px rgba(0,82,155,0.1);
            border:1px solid rgba(255,255,255,0.8);
            transition:0.2s;
        }
        .info-card h3 {
            color:#00529B;font-size:16px;margin-bottom:12px;
            padding-bottom:10px;border-bottom:2px solid rgba(0,82,155,0.15);
            font-weight:600;
        }
        .info-item {display:flex;padding:10px 0;border-bottom:1px solid rgba(0,0,0,0.04);font-size:14px;}
        .info-item:last-child {border-bottom:none;}
        .label {width:90px;color:#64748b;flex-shrink:0;}
        .value {flex:1;color:#1e293b;word-break:break-all;font-weight:500;}

        .tip {text-align:center;color:#94a3b8;font-size:11px;margin-top:16px;line-height:1.6;}
        .hide{display:none !important;}
    </style>
</head>
<body>
<div class="header">
    <h2>中铁装配｜钢结构构件信息</h2>
    <p>CHINA RAILWAY ASSEMBLY</p>
</div>

<div class="full-wrap" id="fullWrap">
    <div class="full-tip hide" id="fullTip">💡微信内建议点右上角「在浏览器打开」可横屏查看</div>
    <div class="model-container">
        <model-viewer id="viewer" alt="构件3D模型" shadow-intensity="1" camera-controls interaction-prompt="auto" ar></model-viewer>
        <!-- 工具栏 -->
        <div class="viewer-toolbar">
            <button class="tool-btn" id="btnAutoRotate">自动旋转</button>
            <button class="tool-btn" id="btnResetCam">重置视角</button>
            <button class="tool-btn" id="btnFull">⛶全屏</button>
            <button class="tool-btn hide" id="btnPanelToggle">隐藏信息</button>
        </div>
        <div class="loading-mask" id="loadingMask">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">正在加载3D模型...</div>
            <div class="loading-progress">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>
        <div class="error-tip" id="errorTip">
            <p>3D模型加载失败，请检查网络后刷新</p>
        </div>
    </div>

    <div class="info-card" id="infoCard">
        <h3>构件基本信息</h3>
        <div class="info-item"><div class="label">构件编号</div><div class="value" id="partId">-</div></div>
        <div class="info-item"><div class="label">加工号</div><div class="value" id="workNo">-</div></div>
        <div class="info-item"><div class="label">项目名称</div><div class="value" id="projectName">-</div></div>
        <div class="info-item"><div class="label">分部工程</div><div class="value" id="section">-</div></div>
        <div class="info-item"><div class="label">构件类型</div><div class="value" id="partType">-</div></div>
        <div class="info-item"><div class="label">材质</div><div class="value" id="material">-</div></div>
        <div class="info-item"><div class="label">规格</div><div class="value" id="spec">-</div></div>
        <div class="info-item"><div class="label">数量</div><div class="value" id="quantity">-</div></div>
    </div>
</div>

<p class="tip">中铁装配 · 钢结构构件一物一码系统<br>制作人：赵文杰</p>

<script src="data.js"></script>
<script>
const urlParams = new URLSearchParams(window.location.search);
const id = urlParams.get('id');
const viewer = document.getElementById('viewer');
const loadingMask = document.getElementById('loadingMask');
const loadingText = document.getElementById('loadingText');
const progressBar = document.getElementById('progressBar');
const errorTip = document.getElementById('errorTip');
const fullWrap = document.getElementById('fullWrap');
const btnFull = document.getElementById('btnFull');
const btnPanelToggle = document.getElementById('btnPanelToggle');
const btnAutoRotate = document.getElementById('btnAutoRotate');
const btnResetCam = document.getElementById('btnResetCam');
const infoCard = document.getElementById('infoCard');
const fullTip = document.getElementById('fullTip');

let autoRotateState = false;
let tipTimer = null;
const fields = ['partId','workNo','projectName','section','partType','material','spec','quantity'];

if (id && window.partData && window.partData[id]) {
    const d = window.partData[id];
    // 填充数据
    fields.forEach(f => {
        const el = document.getElementById(f);
        if(el && d[f]) el.innerText = d[f];
    });
    // 预加载模型，提前发起请求
    const preLink = document.createElement('link');
    preLink.rel = 'preload';
    preLink.as = 'fetch';
    preLink.href = d.glbUrl;
    document.head.appendChild(preLink);

    viewer.src = d.glbUrl;
    // 旋转速度调快，让效果明显
    viewer.autoRotateSpeed = 3;

    viewer.addEventListener('progress', (e) => {
        if (e.total) {
            const percent = Math.round((e.loaded / e.total) * 100);
            progressBar.style.width = percent + '%';
            loadingText.innerText = `正在加载3D模型... ${percent}%`;
        }
    });
    viewer.addEventListener('load', () => loadingMask.style.display = 'none');
    viewer.addEventListener('error', () => {
        loadingMask.style.display = 'none';
        errorTip.style.display = 'flex';
    });
}else{
    document.querySelector('.header h2').innerText = '构件信息未找到';
    document.querySelector('.model-container').style.display = 'none';
    loadingMask.style.display = 'none';
}

// 点击提示关闭
fullTip.onclick = ()=>{
    fullTip.classList.add('hide');
    clearTimeout(tipTimer);
}

// 自动旋转开关
btnAutoRotate.onclick = ()=>{
    autoRotateState = !autoRotateState;
    viewer.autoRotate = autoRotateState;
    btnAutoRotate.classList.toggle('active',autoRotateState);
    btnAutoRotate.innerText = autoRotateState ? "旋转中" : "自动旋转";
}

// 重置视角
btnResetCam.onclick = ()=>{
    viewer.cameraOrbit = "0deg 75deg 105%";
    viewer.cameraTarget = "auto";
}

// 全屏按钮
btnFull.onclick = async ()=>{
    try{
        if(!document.fullscreenElement){
            await fullWrap.requestFullscreen();
            btnPanelToggle.classList.remove('hide');
            fullTip.classList.remove('hide');
            // 5秒自动消失提示
            tipTimer = setTimeout(()=>{
                fullTip.classList.add('hide');
            },5000);
            btnFull.innerText="⤢退出全屏";
        }else{
            await document.exitFullscreen();
        }
    }catch(e){console.warn("全屏异常",e)}
}

// 监听退出全屏
document.addEventListener('fullscreenchange',()=>{
    if(!document.fullscreenElement){
        btnPanelToggle.classList.add('hide');
        fullTip.classList.add('hide');
        fullWrap.classList.remove('panel-hidden');
        infoCard.classList.remove('hide');
        clearTimeout(tipTimer);
        btnFull.innerText="⛶全屏";
    }
})

// 隐藏/显示信息卡片，全屏时模型占满
btnPanelToggle.onclick = ()=>{
    const hidden = infoCard.classList.toggle('hide');
    fullWrap.classList.toggle('panel-hidden',hidden);
    btnPanelToggle.innerText = hidden ? "显示信息" : "隐藏信息";
}
</script>
</body>
</html>
