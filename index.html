<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>中铁装配 钢结构构件信息</title>
    <link rel="preconnect" href="https://cdn.bootcdn.net" crossorigin>
    <link rel="preconnect" href="https://gcore.jsdelivr.net" crossorigin>
    <script type="module" defer src="https://cdn.bootcdn.net/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
        html,body{height:100%;overscroll-behavior:none;}
        body {
            background:linear-gradient(160deg,#eef3f9 0%,#e4edf7 50%,#edeaf5 100%);
            padding:14px;max-width:100%;margin:0 auto;
            font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
            overflow-x:hidden;
            animation:pageIn .5s cubic-bezier(.22,1,.36,1);
        }
        @keyframes pageIn {from{opacity:0;transform:translateY(12px) scale(.99)}to{opacity:1;transform:translateY(0) scale(1)}}

        /* ===== 触摸光晕 ===== */
        .glow {
            position:fixed;width:480px;height:480px;border-radius:50%;
            background:radial-gradient(circle,rgba(140,120,255,.22) 0%,rgba(90,150,255,.14) 40%,transparent 70%);
            pointer-events:none;transform:translate(-50%,-50%);z-index:1;
            opacity:0;transition:opacity .4s ease;will-change:transform;
        }

        /* ===== 顶部标题栏 ===== */
        .header {
            position:relative;z-index:2;
            background:rgba(220,235,250,.65);
            backdrop-filter:blur(36px) saturate(220%);
            -webkit-backdrop-filter:blur(36px) saturate(220%);
            color:#1e3a5f;padding:14px 16px;border-radius:22px;text-align:center;margin-bottom:10px;
            box-shadow:0 8px 32px rgba(50,100,180,.12), 0 0 24px rgba(140,180,255,.25);
            border:1px solid rgba(255,255,255,.85);
            transition:opacity .35s ease, transform .45s cubic-bezier(.22,1,.36,1);
        }
        .header h2 {font-size:17px;font-weight:600;letter-spacing:.5px;}
        .header p {font-size:10px;opacity:.6;margin-top:4px;letter-spacing:2px;font-weight:400;}

        /* ===== 主容器 ===== */
        .full-wrap {position:relative;z-index:2;width:100%;}
        .model-container {
            position:relative;width:100%;height:520px;
            background:rgba(220,235,250,.65);
            backdrop-filter:blur(36px) saturate(220%);
            border-radius:26px;overflow:hidden;
            box-shadow:0 16px 48px rgba(50,100,180,.15), 0 0 32px rgba(140,180,255,.28);
            border:1px solid rgba(255,255,255,.85);
            transition:border-radius .55s cubic-bezier(.22,1,.36,1), background .55s ease;
        }

        /* ===== model-viewer 核心配置（优化跟手） ===== */
        model-viewer {
            width:100%;height:100%;
            --poster-color:#e8f2fc;
            touch-action:none;
            /* 跟手优化：提高插值衰减，减少拖动延迟感 */
            interpolation-decay:0.12;
            min-image-width:512;
            camera-orbit:0deg 75deg auto;
            camera-target:0m 0m 0m;
            field-of-view:30deg;
            min-field-of-view:5deg;
            max-field-of-view:80deg;
            /* 360度旋转：垂直方向允许完整范围 */
            polar-min:-90deg;
            polar-max:270deg;
        }
        model-viewer::part(ar-button),model-viewer::part(default-ar-button){display:none!important;}

        /* ===== 右侧工具栏 ===== */
        .toolbar{
            position:absolute;right:12px;top:50%;transform:translateY(-50%);z-index:20;
            display:flex;flex-direction:column;gap:10px;align-items:center;
            transition:opacity .3s ease, transform .4s cubic-bezier(.22,1,.36,1);
        }
        .btn{
            width:42px;height:42px;border-radius:50%;
            background:rgba(255,255,255,.6);
            backdrop-filter:blur(24px) saturate(220%);
            -webkit-backdrop-filter:blur(24px) saturate(220%);
            color:#2563a8;border:1px solid rgba(255,255,255,.9);
            font-size:18px;cursor:pointer;
            box-shadow:0 4px 14px rgba(50,100,180,.1);
            transition:transform .2s cubic-bezier(.22,1,.36,1), background .25s ease, box-shadow .25s ease;
            display:flex;align-items:center;justify-content:center;
        }
        .btn:active{transform:scale(.88);transition-duration:.1s;}
        .btn.active{background:#2563a8;color:#fff;box-shadow:0 6px 20px rgba(37,99,168,.4);}

        /* ===== 提示条 ===== */
        .tip-banner{
            position:absolute;left:50%;transform:translateX(-50%) translateY(-8px);
            top:20px;z-index:21;color:#2563a8;font-size:12px;
            background:rgba(255,255,255,.85);backdrop-filter:blur(24px);
            padding:8px 18px;border-radius:26px;white-space:nowrap;
            box-shadow:0 8px 24px rgba(50,100,180,.15);
            opacity:0;pointer-events:none;
            transition:opacity .35s ease, transform .45s cubic-bezier(.22,1,.36,1);
        }
        .tip-banner.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}

        /* ===== Toast ===== */
        .toast{
            position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);
            z-index:99;color:#2563a8;font-size:14px;font-weight:500;
            background:rgba(255,255,255,.92);backdrop-filter:blur(28px);
            padding:14px 28px;border-radius:26px;
            box-shadow:0 16px 48px rgba(50,100,180,.25);
            opacity:0;pointer-events:none;
            transition:opacity .3s ease, transform .35s cubic-bezier(.22,1,.36,1);
        }
        .toast.show{opacity:1;transform:translate(-50%,-50%) scale(1);}

        /* ===== 底部模型选择面板 ===== */
        .model-list{
            position:fixed;left:0;right:0;bottom:0;z-index:99;
            background:rgba(238,243,249,.96);
            backdrop-filter:blur(40px) saturate(200%);
            -webkit-backdrop-filter:blur(40px) saturate(200%);
            border-radius:28px 28px 0 0;padding:20px 16px calc(30px + env(safe-area-inset-bottom));
            max-height:80vh;overflow-y:auto;
            transform:translateY(105%);
            transition:transform .5s cubic-bezier(.22,1,.36,1);
            box-shadow:0 -12px 48px rgba(50,100,180,.2);
        }
        .model-list.show{transform:translateY(0);}
        .model-list h3{color:#1e3a5f;font-size:15px;margin-bottom:6px;text-align:center;font-weight:600;}
        .model-list .drag-handle{
            width:36px;height:4px;border-radius:2px;background:rgba(100,140,200,.25);
            margin:0 auto 16px;
        }
        #modelItems{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
        .model-item{
            padding:14px;background:rgba(255,255,255,.75);border-radius:16px;
            cursor:pointer;
            transition:transform .25s cubic-bezier(.22,1,.36,1), box-shadow .25s ease;
            box-shadow:0 4px 16px rgba(50,100,180,.08);
            border:1px solid rgba(255,255,255,.9);
            opacity:0;transform:translateY(16px);
        }
        .model-list.show .model-item{
            opacity:1;transform:translateY(0);
            transition:opacity .4s ease, transform .45s cubic-bezier(.22,1,.36,1);
        }
        .model-item:active{transform:scale(.96);transition-duration:.1s;}
        .model-item .mid{color:#1e3a5f;font-size:13px;font-weight:600;}
        .model-item .mname{color:#6088b8;font-size:10px;margin-top:3px;line-height:1.3;}

        .model-mask{
            position:fixed;inset:0;background:rgba(30,50,90,.2);z-index:98;
            opacity:0;pointer-events:none;
            transition:opacity .4s ease;
            backdrop-filter:blur(2px);
            -webkit-backdrop-filter:blur(2px);
        }
        .model-mask.show{opacity:1;pointer-events:auto;}

        /* ===== 加载进度条 ===== */
        .progress{
            position:absolute;top:0;left:0;width:100%;height:3px;
            background:rgba(160,200,240,.2);z-index:11;overflow:hidden;
            transition:opacity .4s ease;
        }
        .progress.done{opacity:0;}
        .bar{
            height:100%;width:0%;
            background:linear-gradient(90deg,#7ba8f0,#2563a8,#7ba8f0);
            background-size:200% 100%;
            box-shadow:0 0 10px rgba(123,168,240,.8);
            transition:width .3s ease;
            animation:barFlow 2s linear infinite;
        }
        @keyframes barFlow{
            0%{background-position:0% 0;}
            100%{background-position:200% 0;}
        }
        .loading{
            position:absolute;top:0;left:0;width:100%;height:100%;
            background:rgba(228,237,247,.55);
            backdrop-filter:blur(20px);
            -webkit-backdrop-filter:blur(20px);
            display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;
            transition:opacity .45s ease;
        }
        .loading-ring{
            position:relative;width:60px;height:60px;
        }
        .loading-ring .ring{
            position:absolute;inset:0;border-radius:50%;
            border:3px solid transparent;
        }
        .loading-ring .ring1{
            border-top-color:#2563a8;
            animation:spin 1s cubic-bezier(.5,.1,.5,.9) infinite;
        }
        .loading-ring .ring2{
            inset:8px;border-width:2px;
            border-bottom-color:rgba(123,168,240,.6);
            animation:spinReverse 1.5s cubic-bezier(.5,.1,.5,.9) infinite;
        }
        .loading-ring .ring3{
            inset:16px;border-width:2px;
            border-left-color:rgba(140,180,255,.4);
            animation:spin .8s linear infinite;
        }
        @keyframes spinReverse{to{transform:rotate(-360deg);}}
        .loading-text{font-size:14px;color:#2563a8;margin-top:20px;font-weight:500;letter-spacing:.5px;}
        .loading-sub{font-size:11px;color:#7098c8;margin-top:6px;opacity:.7;}
        .progress-percent{font-size:26px;font-weight:700;color:#2563a8;margin-top:10px;letter-spacing:-1px;}
        @keyframes spin{to{transform:rotate(360deg)}}
        .error{
            display:none;position:absolute;top:0;left:0;width:100%;height:100%;
            background:rgba(255,255,255,.92);flex-direction:column;align-items:center;justify-content:center;
            z-index:10;color:#557;
        }

        /* ===== 构件信息卡片 ===== */
        .info-card{
            background:rgba(220,235,250,.65);
            backdrop-filter:blur(36px) saturate(220%);
            -webkit-backdrop-filter:blur(36px) saturate(220%);
            padding:22px;border-radius:26px;margin-top:14px;
            box-shadow:0 10px 40px rgba(50,100,180,.12), 0 0 24px rgba(140,180,255,.25);
            border:1px solid rgba(255,255,255,.85);
            transition:opacity .4s ease, transform .45s cubic-bezier(.22,1,.36,1);
        }
        .info-card h3{
            color:#1e3a5f;font-size:16px;margin-bottom:14px;
            padding-bottom:12px;border-bottom:1px solid rgba(50,100,180,.12);font-weight:600;
        }
        .row{display:flex;padding:11px 0;border-bottom:1px solid rgba(50,100,180,.05);font-size:14px;line-height:1.5;}
        .row:last-child{border-bottom:none;}
        .k{width:90px;color:#6088b8;flex-shrink:0;font-weight:400;}
        .v{flex:1;color:#1e3a5f;word-break:break-all;font-weight:500;}
        .info-card.hide{opacity:0;transform:translateY(24px);pointer-events:none;}

        .footer{text-align:center;color:#7098c8;font-size:11px;margin-top:18px;line-height:1.7;transition:opacity .3s;}
        .hide{display:none!important;}

        /* ===== 全屏浮层（FLIP动画容器） ===== */
        .fs-overlay{
            position:fixed;z-index:100000;overflow:hidden;
            background:linear-gradient(160deg,#eef3f9 0%,#e4edf7 50%,#edeaf5 100%);
            transition:
                left .55s cubic-bezier(.22,1,.36,1),
                top .55s cubic-bezier(.22,1,.36,1),
                width .55s cubic-bezier(.22,1,.36,1),
                height .55s cubic-bezier(.22,1,.36,1),
                border-radius .55s cubic-bezier(.22,1,.36,1),
                padding .55s cubic-bezier(.22,1,.36,1),
                transform .55s cubic-bezier(.22,1,.36,1);
        }
        .fs-overlay::before{
            content:'';position:absolute;inset:10px;border-radius:30px;
            border:1.5px solid rgba(150,190,255,.4);
            box-shadow:0 0 40px rgba(150,190,255,.25), inset 0 0 40px rgba(150,190,255,.1);
            pointer-events:none;z-index:1;opacity:0;
            transition:opacity .6s ease .15s;
        }
        .fs-overlay.fs-active::before{opacity:1;}

        /* 全屏模式下的内部布局 */
        .fs-overlay .model-container{
            width:100%;height:100%;border-radius:0;
            background:rgba(220,235,250,.5);
        }
        .fs-overlay.fs-page{
            display:flex;flex-direction:column;gap:12px;padding:16px;
        }
        .fs-overlay.fs-page .full-wrap{
            display:flex;flex-direction:column;flex:1;height:100%;gap:0;margin:0;
        }
        .fs-overlay.fs-page .model-container{flex:1;height:auto;border-radius:20px;}
        .fs-overlay.fs-page .info-card{
            padding:14px 18px;border-radius:18px;margin-top:12px;
            display:grid;grid-template-columns:repeat(4,1fr);gap:6px 14px;
        }
        .fs-overlay.fs-page .info-card h3{
            grid-column:1/-1;font-size:13px;margin:0 0 2px;padding-bottom:6px;
        }
        .fs-overlay.fs-page .info-card .row{
            display:block;padding:0;font-size:12px;line-height:1.4;border-bottom:none;
        }
        .fs-overlay.fs-page .info-card .k{
            width:auto;display:block;font-size:11px;opacity:.7;margin-bottom:1px;
        }
        .fs-overlay.fs-page .info-card .v{font-size:12px;}

        /* 全屏模式下隐藏非必要元素 */
        .fs-overlay.fs-model .info-card,
        .fs-overlay.fs-model .tip-banner{display:none!important;}

        /* 全屏控制按钮（绝对定位在overlay内） */
        .fs-ctrl{
            position:absolute;z-index:50;width:46px;height:46px;border-radius:50%;
            background:rgba(255,255,255,.85);backdrop-filter:blur(24px);
            border:1px solid rgba(255,255,255,.9);
            box-shadow:0 6px 20px rgba(50,100,180,.2);
            display:flex;align-items:center;justify-content:center;
            font-size:20px;cursor:pointer;color:#2563a8;
            opacity:0;transform:scale(.6);
            transition:opacity .3s ease .25s, transform .4s cubic-bezier(.22,1,.36,1) .25s;
        }
        .fs-overlay.fs-active .fs-ctrl{opacity:1;transform:scale(1);}
        .fs-ctrl:active{transform:scale(.88);transition-duration:.1s;}
        .fs-exit{top:18px;right:18px;}
        .fs-rotate{bottom:22px;right:18px;}

        /* 页面级全屏状态：隐藏非全屏元素 */
        body.in-fs .header,
        body.in-fs .footer{opacity:0;pointer-events:none;transform:translateY(-8px);}
        body.in-fs .header,body.in-fs .footer{
            transition:opacity .35s ease, transform .4s cubic-bezier(.22,1,.36,1);
        }

        /* 横屏旋转 */
        .fs-overlay.landscape{
            /* 横屏模式由JS控制尺寸 */
        }
        .fs-overlay.landscape .model-container{
            /* 模型容器在横屏模式下由JS控制 */
        }
    </style>
</head>
<body>
<div class="glow" id="glow"></div>
<div class="toast" id="toast">✅ 操作成功</div>

<div class="header">
    <h2>中铁装配｜钢结构构件信息</h2>
    <p>CHINA RAILWAY ASSEMBLY</p>
</div>

<div class="full-wrap" id="fullWrap">
    <div class="model-container" id="modelContainer">
        <div class="progress"><div class="bar" id="bar"></div></div>
        <model-viewer id="viewer" alt="构件3D模型" shadow-intensity="0.3" camera-controls interaction-prompt="auto" polar-min="-90deg" polar-max="270deg" min-field-of-view="5deg" max-field-of-view="80deg" exposure="1" tone-mapping="neutral"></model-viewer>
        <div class="toolbar" id="toolbar">
            <button class="btn" id="btnRotate" title="自动旋转">🔄</button>
            <button class="btn" id="btnReset" title="重置视角">🎯</button>
            <button class="btn" id="btnFull" title="整页全屏">⛶</button>
            <button class="btn" id="btnModelFull" title="模型占满全屏">🖥️</button>
            <button class="btn" id="btnSwitch" title="切换构件">🔀</button>
        </div>
        <div class="tip-banner" id="tipBanner">💡竖屏横屏都可查看，拖动旋转360度看模型</div>
        <div class="loading" id="loading">
            <div class="loading-ring">
                <div class="ring ring1"></div>
                <div class="ring ring2"></div>
                <div class="ring ring3"></div>
            </div>
            <div class="loading-text" id="loadingText">正在加载3D模型</div>
            <div class="loading-sub" id="loadingSub">正在下载模型数据…</div>
            <div class="progress-percent" id="percent">0%</div>
        </div>
        <div class="error" id="error">
            <p>3D模型加载失败，请检查网络刷新</p>
        </div>
    </div>

    <div class="info-card" id="infoCard">
        <h3>构件基本信息</h3>
        <div class="row"><div class="k">构件编号</div><div class="v" id="partId">-</div></div>
        <div class="row"><div class="k">加工号</div><div class="v" id="workNo">-</div></div>
        <div class="row"><div class="k">项目名称</div><div class="v" id="projectName">-</div></div>
        <div class="row"><div class="k">分部工程</div><div class="v" id="section">-</div></div>
        <div class="row"><div class="k">构件类型</div><div class="v" id="partType">-</div></div>
        <div class="row"><div class="k">材质</div><div class="v" id="material">-</div></div>
        <div class="row"><div class="k">规格</div><div class="v" id="spec">-</div></div>
        <div class="row"><div class="k">数量</div><div class="v" id="quantity">-</div></div>
    </div>
</div>

<div class="model-mask" id="modelMask"></div>
<div class="model-list" id="modelList">
    <div class="drag-handle"></div>
    <h3>选择要查看的构件</h3>
    <div id="modelItems"></div>
</div>

<p class="footer">中铁装配 · 钢结构构件一物一码系统<br>制作人：赵文杰</p>

<script src="data.js"></script>
<script>
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const id = new URLSearchParams(location.search).get('id');
const viewer = $('#viewer'), loading = $('#loading'), bar = $('#bar'), percent = $('#percent'),
error = $('#error'), fullWrap = $('#fullWrap'), btnFull = $('#btnFull'), btnModelFull = $('#btnModelFull'),
btnRotate = $('#btnRotate'), btnReset = $('#btnReset'), infoCard = $('#infoCard'), tipBanner = $('#tipBanner'),
glow = $('#glow'), btnSwitch = $('#btnSwitch'), toast = $('#toast'),
modelContainer = $('#modelContainer'), toolbar = $('#toolbar');

let rotate = false, tipTimer = null, retryCount = 0;
const fields = ['partId','workNo','projectName','section','partType','material','spec','quantity'];

/* ===== 模型加载 ===== */
if(id && partData[id]){
    const d = partData[id];
    fields.forEach(f => {const el = $(`#${f}`); if(el && d[f]) el.innerText = d[f];});

    function loadModel(){
        viewer.src = d.glbUrl;
        viewer.autoRotateSpeed = 5;
    }
    loadModel();

    viewer.addEventListener('progress', e => {
        if(e.total){
            const p = Math.round(e.loaded/e.total*100);
            bar.style.width = p + '%';
            percent.innerText = p + '%';
            // 阶段提示文字
            const sub = $('#loadingSub');
            if(p < 30) sub.innerText = '正在下载模型数据…';
            else if(p < 70) sub.innerText = '正在传输模型文件…';
            else if(p < 95) sub.innerText = '正在解析模型…';
            else sub.innerText = '即将完成…';
        }
    });
    viewer.addEventListener('load', () => {
        bar.style.width = '100%';
        percent.innerText = '100%';
        $('#loadingSub').innerText = '加载完成';
        setTimeout(()=>{
            loading.style.opacity = '0';
            setTimeout(()=>{ loading.style.display = 'none'; }, 450);
            document.querySelector('.progress').classList.add('done');
            tipBanner.classList.add('show');
            tipTimer = setTimeout(()=>tipBanner.classList.remove('show'), 5000);
        }, 300);
    });
    viewer.addEventListener('error', () => {
        if(retryCount < 1){retryCount++; setTimeout(loadModel, 1000);}
        else {loading.style.display='none'; error.style.display='flex';}
    });
}else{
    document.querySelector('.header h2').innerText = '构件信息未找到';
    modelContainer.style.display = 'none';
    loading.style.display = 'none';
}

/* ===== 触摸光晕 ===== */
let glowRAF = null;
function moveGlow(x,y){
    if(glowRAF) return;
    glowRAF = requestAnimationFrame(()=>{
        glow.style.left = x + 'px';
        glow.style.top = y + 'px';
        glow.style.opacity = '1';
        glowRAF = null;
    });
}
document.addEventListener('mousemove', e => moveGlow(e.clientX, e.clientY));
document.addEventListener('touchmove', e => { if(e.touches[0]) moveGlow(e.touches[0].clientX, e.touches[0].clientY); }, {passive:true});
document.addEventListener('mouseleave', () => glow.style.opacity = '0');

/* ===== 自动旋转 & 重置 ===== */
btnRotate.onclick = () => {
    rotate = !rotate; viewer.autoRotate = rotate;
    btnRotate.classList.toggle('active', rotate);
}
btnReset.onclick = () => {
    // 平滑重置视角
    const startOrbit = viewer.getCameraOrbit();
    viewer.cameraOrbit = "0deg 75deg auto";
    viewer.cameraTarget = "0m 0m 0m";
}

/* ===== 三击定位 ===== */
let clickCount = 0, clickTimer = null;
viewer.addEventListener('click', (e) => {
    clickCount++;
    clearTimeout(clickTimer);
    clickTimer = setTimeout(() => {
        if(clickCount === 3){
            const p = e.intersectionPoint;
            if(p){
                viewer.cameraTarget = `${p.x}m ${p.y}m ${p.z}m`;
                showToast("已定位到该点");
            }
        }
        clickCount = 0;
    }, 350);
});

/* ===== Toast ===== */
function showToast(msg, duration = 1800){
    toast.innerText = msg;
    toast.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(()=>toast.classList.remove('show'), duration);
}

/* ===== 模型选择面板 ===== */
const modelList = $('#modelList'), modelMask = $('#modelMask'), modelItems = $('#modelItems');
btnSwitch.onclick = () => {
    modelItems.innerHTML = '';
    Object.keys(partData).forEach((pid, idx) => {
        const d = partData[pid];
        const item = document.createElement('div');
        item.className = 'model-item';
        item.style.transitionDelay = (idx * 60) + 'ms';
        item.innerHTML = `<div class="mid">构件编号：${d.partId || pid}</div><div class="mname">${d.projectName || ''} · ${d.partType || ''}</div>`;
        item.onclick = () => {
            modelMask.click();
            setTimeout(()=>{ location.href = location.pathname + "?id=" + pid; }, 300);
        };
        modelItems.appendChild(item);
    });
    modelList.classList.add('show');
    modelMask.classList.add('show');
};
modelMask.onclick = () => {
    modelList.classList.remove('show');
    modelMask.classList.remove('show');
};
tipBanner.onclick = () => {
    tipBanner.classList.remove('show');
    clearTimeout(tipTimer);
}

/* ============================================================
 *  FLIP 平滑全屏系统
 *  模仿 iOS / HarmonyOS 共享元素转场动画
 *  ============================================================ */
const EASE = 'cubic-bezier(.22,1,.36,1)'; // easeOutQuint，接近iOS
const FS_DURATION = 550; // ms

let fsState = null; // { overlay, type, sourceEl, parentEl, rect, isLandscape, infoHidden }

/**
 * 进入全屏模式（自定义overlay，平滑过渡）
 * @param {string} type - 'model' 或 'page'
 */
async function enterFullscreen(type){
    if(fsState) return;

    const sourceEl = type === 'model' ? modelContainer : fullWrap;
    const rect = sourceEl.getBoundingClientRect();
    const parentEl = sourceEl.parentElement;

    // 创建全屏浮层
    const overlay = document.createElement('div');
    overlay.className = 'fs-overlay fs-' + type;
    overlay.style.left = rect.left + 'px';
    overlay.style.top = rect.top + 'px';
    overlay.style.width = rect.width + 'px';
    overlay.style.height = rect.height + 'px';
    overlay.style.borderRadius = '26px';

    // 把源元素移入overlay
    overlay.appendChild(sourceEl);
    document.body.appendChild(overlay);

    // 添加全屏控制按钮
    const exitBtn = document.createElement('div');
    exitBtn.className = 'fs-ctrl fs-exit';
    exitBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>';
    exitBtn.onclick = exitFullscreen;
    overlay.appendChild(exitBtn);

    if(type === 'model'){
        const rotateBtn = document.createElement('div');
        rotateBtn.className = 'fs-ctrl fs-rotate';
        rotateBtn.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="12" height="14" rx="1.5"/><rect x="10" y="3" width="12" height="14" rx="1.5" opacity="0.45"/></svg>';
        rotateBtn.onclick = toggleLandscape;
        overlay.appendChild(rotateBtn);
    }

    // page模式下加一个隐藏信息按钮
    if(type === 'page'){
        const toggleBtn = document.createElement('div');
        toggleBtn.className = 'fs-ctrl fs-rotate';
        toggleBtn.style.bottom = '22px';
        toggleBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>';
        let infoHidden = false;
        toggleBtn.onclick = () => {
            infoHidden = !infoHidden;
            const info = overlay.querySelector('.info-card');
            if(info){
                if(infoHidden){
                    info.style.opacity = '0';
                    info.style.transform = 'translateY(20px)';
                    info.style.pointerEvents = 'none';
                }else{
                    info.style.opacity = '1';
                    info.style.transform = 'translateY(0)';
                    info.style.pointerEvents = 'auto';
                }
            }
        };
        overlay.appendChild(toggleBtn);
    }

    // 记录状态
    fsState = { overlay, type, sourceEl, parentEl, rect, isLandscape: false, infoHidden: false };

    // 隐藏页面其他元素
    document.body.classList.add('in-fs');

    // 强制reflow，确保初始位置生效
    void overlay.offsetHeight;

    // 动画到全屏
    requestAnimationFrame(() => {
        overlay.style.left = '0px';
        overlay.style.top = '0px';
        overlay.style.width = '100vw';
        overlay.style.height = '100vh';
        overlay.style.borderRadius = '0px';

        if(type === 'page'){
            overlay.style.padding = '16px';
        }

        // 触发边框发光
        setTimeout(() => overlay.classList.add('fs-active'), 100);
    });

    // 动画结束后调整model-viewer尺寸
    setTimeout(() => {
        viewer.resize();
    }, FS_DURATION + 100);
}

/**
 * 退出全屏
 */
async function exitFullscreen(){
    if(!fsState) return;
    const { overlay, sourceEl, parentEl, rect } = fsState;

    // 重置横屏
    if(fsState.isLandscape){
        fsState.isLandscape = false;
        overlay.classList.remove('landscape');
        sourceEl.style.transform = '';
        sourceEl.style.transformOrigin = '';
        sourceEl.style.width = '';
        sourceEl.style.height = '';
        sourceEl.style.position = '';
        sourceEl.style.top = '';
        sourceEl.style.left = '';
        sourceEl.style.transition = '';
    }

    // 移除发光
    overlay.classList.remove('fs-active');

    // 动画回原位
    overlay.style.left = rect.left + 'px';
    overlay.style.top = rect.top + 'px';
    overlay.style.width = rect.width + 'px';
    overlay.style.height = rect.height + 'px';
    overlay.style.borderRadius = '26px';
    if(fsState.type === 'page'){
        overlay.style.padding = '0px';
    }

    // 恢复页面元素
    document.body.classList.remove('in-fs');

    // 动画结束后把元素移回原位
    setTimeout(() => {
        parentEl.appendChild(sourceEl);
        overlay.remove();
        fsState = null;
        viewer.resize();
    }, FS_DURATION);
}

/**
 * 切换横竖屏（旋转模型内容）
 */
function toggleLandscape(){
    if(!fsState) return;
    fsState.isLandscape = !fsState.isLandscape;
    const { overlay, sourceEl } = fsState;

    if(fsState.isLandscape){
        // 横屏：旋转模型容器90度
        sourceEl.style.transition = 'transform .5s cubic-bezier(.22,1,.36,1), width .5s cubic-bezier(.22,1,.36,1), height .5s cubic-bezier(.22,1,.36,1)';
        sourceEl.style.width = '100vh';
        sourceEl.style.height = '100vw';
        sourceEl.style.position = 'absolute';
        sourceEl.style.top = '50%';
        sourceEl.style.left = '50%';
        sourceEl.style.transform = 'translate(-50%,-50%) rotate(90deg)';
        sourceEl.style.transformOrigin = 'center center';
        showToast("已切换为横屏");
    }else{
        // 竖屏：恢复
        sourceEl.style.transition = 'transform .5s cubic-bezier(.22,1,.36,1), width .5s cubic-bezier(.22,1,.36,1), height .5s cubic-bezier(.22,1,.36,1)';
        sourceEl.style.width = '100%';
        sourceEl.style.height = '100%';
        sourceEl.style.position = '';
        sourceEl.style.top = '';
        sourceEl.style.left = '';
        sourceEl.style.transform = '';
        sourceEl.style.transformOrigin = '';
        showToast("已切换为竖屏");
    }
    setTimeout(()=>viewer.resize(), 500);
}

/* 绑定按钮 */
btnModelFull.onclick = () => enterFullscreen('model');
btnFull.onclick = () => {
    if(fsState){ exitFullscreen(); }
    else { enterFullscreen('page'); }
};

// ESC键退出全屏
document.addEventListener('keydown', e => {
    if(e.key === 'Escape' && fsState) exitFullscreen();
});

// 窗口大小变化时调整
window.addEventListener('resize', () => {
    if(fsState){
        viewer.resize();
    }
});
</script>
